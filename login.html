<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Theme Meta Tag -->
<meta name="theme-color" content="#0b1a0e">
    <!-- Prevent page zoom and scroll issues -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<!-- Theme Color for Mobile -->
<meta name="theme-color" content="#00e676">
<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="assets/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · QuizNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ===== FAVICON - Browser Tab Logo ===== -->
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 20%, #132b17, #051007);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e2f0e5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            width: 100%;
        }
        .glass {
            background: rgba(15, 32, 19, 0.65);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 100, 0.15);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
            border-radius: 28px;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }
        .glass:hover { border-color: rgba(0, 230, 118, 0.3); }
        .auth-card {
            max-width: 440px;
            width: 100%;
            padding: 40px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .mini-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .logo-icon {
            background: #00e676;
            color: #0b1a0e;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
        }
        .logo-name {
            font-weight: 700;
            font-size: 1.4rem;
            color: #e2f0e5;
        }
        .logo-name .accent { color: #00e676; }
        .auth-header h2 { font-size: 1.8rem; font-weight: 700; }
        .auth-subtitle { color: #8fb89a; margin-top: 4px; }
        .input-group {
            position: relative;
            margin: 14px 0;
        }
        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8fb89a;
            font-size: 1rem;
            opacity: 0.7;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 0, 0, 0.25);
            border: 1.5px solid rgba(45, 74, 52, 0.5);
            border-radius: 16px;
            color: #e2f0e5;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            outline: none;
        }
        .input-group input:focus {
            border-color: #00e676;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.15);
        }
        .input-group .toggle-pw {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #8fb89a;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 4px;
            padding-left: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 20px;
        }
        .btn-primary {
            background: linear-gradient(145deg, #00c853, #00e676);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #0b1a0e;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            box-shadow: 0 4px 24px rgba(0, 230, 118, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            width: 100%;
            margin-top: 10px;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 8px 36px rgba(0, 230, 118, 0.5); }
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 24px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #8fb89a;
            font-size: 0.9rem;
        }
        .checkbox-label input[type="checkbox"] {
            accent-color: #00e676;
            width: 16px;
            height: 16px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #8fb89a;
            font-size: 0.95rem;
        }
        .link-accent {
            color: #00e676;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }
        .link-accent:hover { text-shadow: 0 0 20px #00e676; }
        .admin-link { margin-top: 8px; }
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
        }
        .toast {
            background: rgba(20, 40, 25, 0.92);
            backdrop-filter: blur(14px);
            border-left: 4px solid #00e676;
            padding: 14px 20px;
            border-radius: 16px;
            color: #e2f0e5;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            font-weight: 500;
            animation: slideUp 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.error { border-left-color: #ff4444; }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .page-enter { animation: fadeScale 0.6s ease; }
        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <body data-theme="dark"></body>
    <canvas id="particles-canvas"></canvas>
    <div class="auth-container page-enter">
        <div class="glass auth-card">
            <div class="auth-header">
                <!-- ===== BIG LOGO - 140px ===== -->
                <img src="assets/images/logo.png" alt="QuizNexus" style="width:140px; height:140px; object-fit:contain; display:block; margin:0 auto 16px;">
                <div class="mini-logo">
                    <span class="logo-icon">QN</span>
                    <span class="logo-name">Quiz<span class="accent">Nexus</span></span>
                </div>
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to continue your journey</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginFullName" placeholder="Full Name" required>
                    <div class="error-msg" id="nameError"></div>
                </div>
                <div class="input-group">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="loginRollNumber" placeholder="Roll Number" required>
                    <div class="error-msg" id="rollError"></div>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="error-msg" id="passwordError"></div>
                </div>
                <div class="auth-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="link-accent" onclick="showForgotPassword(); return false;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html" class="link-accent">Create Account</a></p>
                <p class="admin-link">🔐 <a href="admin-login.html" class="link-accent">Admin Login</a></p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const DB = {
            USERS: 'quiznexus_users',
            CURRENT_USER: 'quiznexus_current_user',
            getUsers() { return JSON.parse(localStorage.getItem(this.USERS)) || []; },
            getCurrentUser() {
                const data = localStorage.getItem(this.CURRENT_USER);
                return data ? JSON.parse(data) : null;
            },
            setCurrentUser(user) { localStorage.setItem(this.CURRENT_USER, JSON.stringify(user)); },
            clearCurrentUser() { localStorage.removeItem(this.CURRENT_USER); }
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        function redirectTo(page) { window.location.href = page; }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            const icon = input.parentElement?.querySelector('.toggle-pw i');
            if (icon) {
                icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            }
        }

        function showForgotPassword() {
            showToast('Please contact admin to reset your password', 'info');
        }

        function handleLogin() {
            const fullName = document.getElementById('loginFullName').value.trim();
            const rollNumber = document.getElementById('loginRollNumber').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe')?.checked || false;

            if (!fullName || !rollNumber || !password) {
                showToast('Please fill all fields', 'error');
                return;
            }

            const users = DB.getUsers();
            const user = users.find(u => 
                u.fullName.toLowerCase() === fullName.toLowerCase() && 
                u.rollNumber === rollNumber && 
                u.password === password
            );

            if (!user) {
                showToast('Invalid credentials!', 'error');
                return;
            }

            if (user.isBanned) {
                showToast('Your account has been banned!', 'error');
                return;
            }

            DB.setCurrentUser(user);
            if (rememberMe) {
                localStorage.setItem('quiznexus_remember', 'true');
            }

            showToast('Welcome back, ' + user.fullName + '! 🎉');
            setTimeout(() => redirectTo('dashboard.html'), 500);
        }

        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            const particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 118, ${p.opacity})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        document.addEventListener('DOMContentLoaded', function() {
            initParticles();
            const currentUser = DB.getCurrentUser();
            if (currentUser) {
                redirectTo('dashboard.html');
            }
        });

        window.handleLogin = handleLogin;
        window.togglePassword = togglePassword;
        window.showForgotPassword = showForgotPassword;
    </script>
</body>
</html>
