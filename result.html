<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Theme Meta Tag -->
<meta name="theme-color" content="#0b1a0e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results · QuizNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 20%, #132b17, #051007);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e2f0e5;
            padding: 20px;
        }
        .glass {
            background: rgba(15, 32, 19, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 100, 0.15);
            border-radius: 28px;
            transition: 0.3s;
        }
        .glass:hover {
            border-color: rgba(0, 230, 118, 0.3);
        }
        .result-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .result-card {
            padding: 36px;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .result-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .result-header h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .result-header .subtitle {
            color: #8fb89a;
            font-size: 0.95rem;
        }
        .result-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 16px 0 24px;
        }
        .result-stat {
            text-align: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            transition: 0.3s;
        }
        .result-stat:hover {
            transform: translateY(-2px);
            background: rgba(0, 230, 118, 0.05);
        }
        .stat-value {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: #00e676;
        }
        .stat-value.gold { color: #ffd700; }
        .stat-value.silver { color: #c0c0c0; }
        .stat-value.red { color: #ff6b6b; }
        .stat-label {
            font-size: 0.85rem;
            color: #8fb89a;
        }
        .result-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0 24px;
        }
        .detail-item {
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }
        .detail-item:hover {
            transform: translateY(-2px);
        }
        .detail-item.correct { border-left: 4px solid #00e676; }
        .detail-item.wrong { border-left: 4px solid #ff4444; }
        .detail-item.skipped { border-left: 4px solid #ffc107; }
        .detail-item.time { border-left: 4px solid #4fc3f7; }
        .detail-item .icon { font-size: 1.2rem; display: block; margin-bottom: 4px; }
        .detail-item .num { font-size: 1.3rem; font-weight: 700; }
        .detail-item .lbl { font-size: 0.75rem; color: #8fb89a; }
        .result-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0 24px;
        }
        .chart-wrapper {
            padding: 16px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }
        .answer-review {
            margin: 24px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .answer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 255, 100, 0.06);
            transition: 0.3s;
        }
        .answer-item:hover {
            background: rgba(0, 230, 118, 0.03);
        }
        .answer-item .q-num {
            font-weight: 600;
            min-width: 40px;
            color: #8fb89a;
        }
        .answer-item .q-text {
            flex: 1;
            font-size: 0.9rem;
        }
        .answer-item .q-result {
            font-size: 1.2rem;
        }
        .answer-item .q-result.correct { color: #00e676; }
        .answer-item .q-result.wrong { color: #ff4444; }
        .answer-item .q-result.skipped { color: #ffc107; }
        .answer-item .q-answer {
            font-size: 0.8rem;
            color: #8fb89a;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 10px;
            border-radius: 20px;
        }
        .result-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .result-actions button {
            padding: 12px 24px;
        }
        .btn-primary {
            background: linear-gradient(145deg, #00c853, #00e676);
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #0b1a0e;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 24px rgba(0, 230, 118, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 36px rgba(0, 230, 118, 0.5);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #00e676;
            color: #00e676;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-outline:hover {
            background: #00e676;
            color: #0b1a0e;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.2);
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
        }
        .toast {
            background: rgba(20, 40, 25, 0.92);
            backdrop-filter: blur(14px);
            border-left: 4px solid #00e676;
            padding: 14px 20px;
            border-radius: 16px;
            color: #e2f0e5;
            margin-top: 10px;
            animation: slideUp 0.4s ease;
        }
        .toast.error { border-left-color: #ff4444; }
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .share-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }
        .share-btn {
            padding: 8px 16px;
            border-radius: 60px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }
        .share-btn:hover { transform: scale(1.05); }
        .share-btn.whatsapp { background: #25D366; color: white; }
        .share-btn.facebook { background: #1877F2; color: white; }
        .share-btn.twitter { background: #000000; color: white; }
        .share-btn.linkedin { background: #0A66C2; color: white; }
        .results-list {
            padding: 20px;
        }
        .results-list .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
        }
        .results-list .result-item:hover {
            transform: translateX(4px);
            border-color: #00e676;
        }
        .results-list .result-item .info { flex: 1; }
        .results-list .result-item .info .title { font-weight: 600; }
        .results-list .result-item .info .date { font-size: 0.8rem; color: #8fb89a; }
        .results-list .result-item .score { text-align: right; }
        .results-list .result-item .score .percent { font-size: 1.2rem; font-weight: 700; color: #00e676; }
        .results-list .result-item .score .detail { font-size: 0.8rem; color: #8fb89a; }
        .empty-results {
            text-align: center;
            padding: 40px;
            color: #8fb89a;
        }
        @media (max-width: 768px) {
            .result-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .result-details { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .result-charts { grid-template-columns: 1fr; gap: 16px; }
            .result-card { padding: 20px; }
            .result-actions { flex-direction: column; }
            .result-actions button { width: 100%; justify-content: center; }
            .results-list .result-item { flex-direction: column; text-align: center; gap: 8px; }
            .results-list .result-item .score { text-align: center; }
        }
        @media (max-width: 480px) {
            .result-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
            .result-stat { padding: 10px; }
            .stat-value { font-size: 1.4rem; }
            .result-details { grid-template-columns: 1fr 1fr; }
            .detail-item { padding: 10px; }
        }
    </style>
</head>
<body>
    <body data-theme="dark"></body>
    <canvas id="particles-canvas"></canvas>

    <div class="result-container" id="resultContainer">
        <!-- Rendered by JavaScript -->
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // ============================================================
        //  DATABASE
        // ============================================================
        const DB = {
            RESULTS: 'quiznexus_results',
            USERS: 'quiznexus_users',
            CURRENT_USER: 'quiznexus_current_user',
            getResults() {
                return JSON.parse(localStorage.getItem(this.RESULTS)) || [];
            },
            getUsers() {
                return JSON.parse(localStorage.getItem(this.USERS)) || [];
            },
            getResultById(id) {
                return this.getResults().find(r => r.id === id) || null;
            },
            getResultsByUserId(userId) {
                return this.getResults().filter(r => r.userId === userId);
            },
            getCurrentUser() {
                const data = localStorage.getItem(this.CURRENT_USER);
                return data ? JSON.parse(data) : null;
            }
        };

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function redirectTo(page) {
            window.location.href = page;
        }

        // ============================================================
        //  PARTICLES
        // ============================================================
        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            const particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 118, ${p.opacity})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // ============================================================
        //  GRADE SYSTEM
        // ============================================================
        function getGrade(percentage) {
            if (percentage >= 90) return 'A+';
            if (percentage >= 80) return 'A';
            if (percentage >= 70) return 'B+';
            if (percentage >= 60) return 'B';
            if (percentage >= 50) return 'C+';
            if (percentage >= 40) return 'C';
            return 'F';
        }

        function getGradeClass(grade) {
            if (grade === 'A+' || grade === 'A') return 'gold';
            if (grade === 'B+' || grade === 'B') return 'silver';
            return 'red';
        }

        // ============================================================
        //  CONFETTI
        // ============================================================
        function launchConfetti() {
            const canvas = document.createElement('canvas');
            canvas.className = 'confetti-canvas';
            canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000;';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const pieces = [];
            const colors = ['#00e676', '#ffd700', '#ff6b6b', '#4fc3f7', '#ff9800', '#e040fb', '#00bcd4'];
            for (let i = 0; i < 150; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    width: Math.random() * 8 + 4,
                    height: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    velocityX: (Math.random() - 0.5) * 3,
                    velocityY: Math.random() * 4 + 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 0.3,
                    opacity: 1
                });
            }
            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                pieces.forEach(p => {
                    p.y += p.velocityY;
                    p.x += p.velocityX;
                    p.rotation += p.rotationSpeed;
                    if (p.y < canvas.height + 50) {
                        active = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation);
                        ctx.globalAlpha = p.opacity;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height);
                        ctx.restore();
                    }
                });
                if (active) animationId = requestAnimationFrame(animate);
                else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.remove(); }
            }
            animate();
            setTimeout(() => { if (animationId) cancelAnimationFrame(animationId); ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.remove(); }, 5000);
        }

        // ============================================================
        //  DISPLAY RESULT
        // ============================================================
        function displayResult(result, user) {
            const container = document.getElementById('resultContainer');
            
            const grade = getGrade(result.percentage);
            const allResults = DB.getResults();
            const betterScores = allResults.filter(r => r.percentage > result.percentage);
            const rank = betterScores.length + 1;
            
            container.innerHTML = `
                <div class="glass result-card">
                    <div class="result-header">
                        <img src="assets/images/logo.png" alt="QuizNexus" style="width:60px;height:60px;object-fit:contain;display:block;margin:0 auto 12px;">
                        <h2>📊 Quiz Results</h2>
                        <p class="subtitle">${result.quizTitle || 'Quiz'}</p>
                        <p style="color:#8fb89a;font-size:0.85rem;margin-top:4px;">${user ? user.fullName : 'User'} · ${new Date(result.completedAt).toLocaleDateString()}</p>
                    </div>

                    <div class="result-stats">
                        <div class="result-stat">
                            <span class="stat-value">${result.score}</span>
                            <span class="stat-label">Score</span>
                        </div>
                        <div class="result-stat">
                            <span class="stat-value">${result.percentage.toFixed(1)}%</span>
                            <span class="stat-label">Percentage</span>
                        </div>
                        <div class="result-stat">
                            <span class="stat-value ${getGradeClass(grade)}">${grade}</span>
                            <span class="stat-label">Grade</span>
                        </div>
                        <div class="result-stat">
                            <span class="stat-value">#${rank}</span>
                            <span class="stat-label">Rank</span>
                        </div>
                    </div>

                    <div class="result-details">
                        <div class="detail-item correct">
                            <span class="icon">✅</span>
                            <span class="num">${result.correct}</span>
                            <span class="lbl">Correct</span>
                        </div>
                        <div class="detail-item wrong">
                            <span class="icon">❌</span>
                            <span class="num">${result.wrong}</span>
                            <span class="lbl">Wrong</span>
                        </div>
                        <div class="detail-item skipped">
                            <span class="icon">⏭️</span>
                            <span class="num">${result.skipped}</span>
                            <span class="lbl">Skipped</span>
                        </div>
                        <div class="detail-item time">
                            <span class="icon">⏱️</span>
                            <span class="num">${result.timeTaken}s</span>
                            <span class="lbl">Time Taken</span>
                        </div>
                    </div>

                    <div class="result-charts">
                        <div class="chart-wrapper glass">
                            <canvas id="resultChart" height="200"></canvas>
                        </div>
                        <div class="chart-wrapper glass">
                            <canvas id="accuracyChart" height="200"></canvas>
                        </div>
                    </div>

                    <div class="glass" style="padding:16px;margin:16px 0;">
                        <h4 style="margin-bottom:12px;">📝 Answer Review</h4>
                        <div class="answer-review" id="answerReview">
                            ${result.answers && result.answers.length > 0 ? result.answers.map((ans, idx) => {
                                const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
                                const isCorrect = ans.isCorrect;
                                const status = isCorrect ? 'correct' : (ans.userAnswer === undefined ? 'skipped' : 'wrong');
                                const icon = isCorrect ? '✅' : (ans.userAnswer === undefined ? '⏭️' : '❌');
                                const userOption = ans.userAnswer !== undefined ? letters[ans.userAnswer] : '—';
                                const correctOption = ans.correctAnswer !== undefined ? letters[ans.correctAnswer] : '—';
                                return `
                                    <div class="answer-item">
                                        <span class="q-num">Q${idx + 1}</span>
                                        <span class="q-text">${ans.questionText || 'Question'}</span>
                                        <span class="q-answer">Your: ${userOption} | Correct: ${correctOption}</span>
                                        <span class="q-result ${status}">${icon}</span>
                                    </div>
                                `;
                            }).join('') : '<p style="color:#8fb89a;text-align:center;padding:20px;">No answer data available</p>'}
                        </div>
                    </div>

                    <div class="result-actions">
                        <button class="btn-primary" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
                        <button class="btn-outline" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                        <button class="btn-outline" onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
                    </div>

                    <div class="share-buttons">
                        <button class="share-btn whatsapp" onclick="shareResult('whatsapp')"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                        <button class="share-btn facebook" onclick="shareResult('facebook')"><i class="fab fa-facebook-f"></i> Facebook</button>
                        <button class="share-btn twitter" onclick="shareResult('twitter')"><i class="fab fa-twitter"></i> Twitter</button>
                        <button class="share-btn linkedin" onclick="shareResult('linkedin')"><i class="fab fa-linkedin-in"></i> LinkedIn</button>
                    </div>
                </div>
            `;

            // Load charts
            loadResultCharts(result);
            
            // Confetti for good score
            if (result.percentage >= 70) {
                launchConfetti();
            }
            
            window.currentResult = result;
            window.currentUser = user;
        }

        // ============================================================
        //  CHARTS
        // ============================================================
        function loadResultCharts(result) {
            const canvas = document.getElementById('resultChart');
            if (canvas) {
                new Chart(canvas, {
                    type: 'doughnut',
                    data: {
                        labels: ['Correct', 'Wrong', 'Skipped'],
                        datasets: [{
                            data: [result.correct, result.wrong, result.skipped],
                            backgroundColor: ['#00e676', '#ff6b6b', '#ffc107'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: '#a0c9a8',
                                    padding: 20,
                                    usePointStyle: true
                                }
                            }
                        },
                        cutout: '70%'
                    }
                });
            }
            const accuracyCanvas = document.getElementById('accuracyChart');
            if (accuracyCanvas) {
                const accuracy = (result.correct / result.total) * 100;
                new Chart(accuracyCanvas, {
                    type: 'bar',
                    data: {
                        labels: ['Your Score', 'Average'],
                        datasets: [{
                            label: 'Percentage',
                            data: [accuracy, 50],
                            backgroundColor: [accuracy >= 60 ? '#00e676' : '#ff6b6b', 'rgba(255,255,255,0.1)'],
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        indexAxis: 'y',
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            x: {
                                max: 100,
                                grid: {
                                    color: 'rgba(255,255,255,0.05)'
                                },
                                ticks: {
                                    color: '#a0c9a8'
                                }
                            },
                            y: {
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    color: '#a0c9a8'
                                }
                            }
                        }
                    }
                });
            }
        }

        // ============================================================
        //  SHARE RESULTS
        // ============================================================
        function shareResult(platform) {
            const result = window.currentResult;
            if (!result) { showToast('No result to share', 'error'); return; }
            
            const text = `🎯 I scored ${result.percentage.toFixed(1)}% on "${result.quizTitle}" quiz! 🏆\n📊 Score: ${result.score}/${result.total}\n✅ Correct: ${result.correct}\n❌ Wrong: ${result.wrong}\n⏭️ Skipped: ${result.skipped}\n\n💪 Test your knowledge at QuizNexus!`;
            const url = window.location.href;
            
            let shareLink = '';
            switch(platform) {
                case 'whatsapp':
                    shareLink = `https://wa.me/?text=${encodeURIComponent(text + '\n\n' + url)}`;
                    break;
                case 'facebook':
                    shareLink = `https://www.facebook.com/sharer/sharer.php?quote=${encodeURIComponent(text)}&u=${encodeURIComponent(url)}`;
                    break;
                case 'twitter':
                    shareLink = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
                    break;
                case 'linkedin':
                    shareLink = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`;
                    break;
                default:
                    showToast('Share feature coming soon!', 'info');
                    return;
            }
            
            if (shareLink) {
                window.open(shareLink, '_blank', 'width=600,height=500');
                showToast(`Sharing on ${platform.charAt(0).toUpperCase() + platform.slice(1)}...`);
            }
        }

        // ============================================================
        //  PDF DOWNLOAD
        // ============================================================
        function downloadPDF() {
            const result = window.currentResult;
            if (!result) { showToast('No result data to export!', 'error'); return; }
            showToast('📄 Generating PDF...');
            
            const content = document.createElement('div');
            content.style.cssText = 'padding:30px;background:#0b1a0e;color:#e2f0e5;font-family:Inter,sans-serif;max-width:800px;margin:0 auto;';
            content.innerHTML = `
                <div style="text-align:center;border-bottom:2px solid #00e676;padding-bottom:16px;margin-bottom:20px;">
                    <h1 style="color:#00e676;font-size:1.8rem;">📊 QuizNexus - Result Report</h1>
                    <p style="color:#8fb89a;">${result.quizTitle || 'Quiz'}</p>
                    <p style="color:#8fb89a;">User: ${window.currentUser ? window.currentUser.fullName : 'Unknown'}</p>
                    <p style="color:#8fb89a;">Date: ${new Date().toLocaleString()}</p>
                </div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;">
                    <div style="text-align:center;padding:12px;background:rgba(0,230,118,0.05);border-radius:12px;border:1px solid rgba(0,230,118,0.1);">
                        <div style="font-size:1.6rem;font-weight:700;color:#00e676;">${result.score}</div>
                        <div style="font-size:0.8rem;color:#8fb89a;">Score</div>
                    </div>
                    <div style="text-align:center;padding:12px;background:rgba(0,230,118,0.05);border-radius:12px;border:1px solid rgba(0,230,118,0.1);">
                        <div style="font-size:1.6rem;font-weight:700;color:#00e676;">${result.percentage.toFixed(1)}%</div>
                        <div style="font-size:0.8rem;color:#8fb89a;">Percentage</div>
                    </div>
                    <div style="text-align:center;padding:12px;background:rgba(0,230,118,0.05);border-radius:12px;border:1px solid rgba(0,230,118,0.1);">
                        <div style="font-size:1.6rem;font-weight:700;color:#ffd700;">${getGrade(result.percentage)}</div>
                        <div style="font-size:0.8rem;color:#8fb89a;">Grade</div>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0;">
                    <div style="padding:10px;text-align:center;background:rgba(0,0,0,0.2);border-radius:10px;">
                        <div style="font-size:1.2rem;font-weight:700;color:#00e676;">${result.correct}</div>
                        <div style="font-size:0.7rem;color:#8fb89a;">Correct</div>
                    </div>
                    <div style="padding:10px;text-align:center;background:rgba(0,0,0,0.2);border-radius:10px;">
                        <div style="font-size:1.2rem;font-weight:700;color:#ff4444;">${result.wrong}</div>
                        <div style="font-size:0.7rem;color:#8fb89a;">Wrong</div>
                    </div>
                    <div style="padding:10px;text-align:center;background:rgba(0,0,0,0.2);border-radius:10px;">
                        <div style="font-size:1.2rem;font-weight:700;color:#ffc107;">${result.skipped}</div>
                        <div style="font-size:0.7rem;color:#8fb89a;">Skipped</div>
                    </div>
                    <div style="padding:10px;text-align:center;background:rgba(0,0,0,0.2);border-radius:10px;">
                        <div style="font-size:1.2rem;font-weight:700;color:#4fc3f7;">${result.timeTaken}s</div>
                        <div style="font-size:0.7rem;color:#8fb89a;">Time Taken</div>
                    </div>
                </div>
                <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,230,118,0.1);color:#8fb89a;font-size:0.8rem;">
                    <p>Generated by QuizNexus · Learn • Practice • Compete</p>
                </div>
            `;
            
            document.body.appendChild(content);
            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `${result.quizTitle || 'Quiz'}_Results.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(content).save().then(() => {
                document.body.removeChild(content);
                showToast('✅ PDF downloaded successfully!');
            }).catch(() => {
                document.body.removeChild(content);
                showToast('Error generating PDF.', 'error');
            });
        }

        // ============================================================
        //  SHOW ALL RESULTS
        // ============================================================
        function showAllResults(user) {
            const results = DB.getResultsByUserId(user.id);
            const container = document.getElementById('resultContainer');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="glass result-card" style="text-align:center;padding:40px;">
                        <i class="fas fa-inbox" style="font-size:3rem;color:#8fb89a;display:block;margin-bottom:16px;"></i>
                        <h3>No Results Yet</h3>
                        <p style="color:#8fb89a;">You haven't taken any quizzes yet.</p>
                        <button class="btn-primary" onclick="window.location.href='quiz.html'" style="margin-top:16px;width:auto;padding:12px 32px;">
                            <i class="fas fa-play"></i> Start a Quiz
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="glass results-list">
                    <h2 style="margin-bottom:20px;">📊 My Results</h2>
                    ${results.sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt)).map(r => `
                        <div class="result-item" onclick="window.location.href='result.html?id=${r.id}'">
                            <div class="info">
                                <div class="title">${r.quizTitle || 'Quiz'}</div>
                                <div class="date">${new Date(r.completedAt).toLocaleDateString()}</div>
                            </div>
                            <div class="score">
                                <div class="percent">${r.percentage.toFixed(1)}%</div>
                                <div class="detail">${r.score}/${r.total} correct</div>
                            </div>
                        </div>
                    `).join('')}
                    <button class="btn-outline" onclick="window.location.href='dashboard.html'" style="margin-top:16px;">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </button>
                </div>
            `;
        }

        // ============================================================
        //  PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = DB.getCurrentUser();
            if (!currentUser) {
                redirectTo('login.html');
                return;
            }
            
            initParticles();
            
            // Check if we have a specific result to show
            const savedResult = sessionStorage.getItem('quiznexus_last_result');
            const urlParams = new URLSearchParams(window.location.search);
            const resultId = urlParams.get('id');
            
            let result = null;
            
            if (savedResult) {
                result = JSON.parse(savedResult);
                // Don't remove it immediately so we can show it
            } else if (resultId) {
                result = DB.getResultById(resultId);
            }
            
            if (result) {
                displayResult(result, currentUser);
            } else {
                showAllResults(currentUser);
            }
        });

        // ============================================================
        //  GLOBAL EXPORTS
        // ============================================================
        window.downloadPDF = downloadPDF;
        window.shareResult = shareResult;
    </script>
</body>
</html>
