<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Theme Meta Tag -->
<meta name="theme-color" content="#0b1a0e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Servers · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <style>
        .servers-container { padding: 28px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }
        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 350px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: 60px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            opacity: 0.5;
        }
        .action-btn {
            padding: 9px 18px;
            border-radius: 60px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn.primary {
            background: linear-gradient(145deg, #00c853, #00e676);
            color: #0b1a0e;
            box-shadow: 0 4px 16px rgba(0,230,118,0.25);
        }
        .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,230,118,0.35);
        }
        .action-btn.glass {
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
        }
        .action-btn.glass:hover { border-color: var(--accent); transform: translateY(-2px); }

        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .server-card {
            padding: 24px;
            border-radius: var(--radius);
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            transition: all 0.3s;
        }
        .server-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: var(--shadow-soft), var(--neon-glow);
        }
        .server-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .server-card .card-top .name {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .server-card .card-top .badge {
            font-size: 0.65rem;
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 600;
        }
        .server-card .card-top .badge.active {
            background: rgba(0,230,118,0.15);
            color: #00e676;
            border: 1px solid rgba(0,230,118,0.2);
        }
        .server-card .card-top .badge.inactive {
            background: rgba(255,68,68,0.15);
            color: #ff4444;
            border: 1px solid rgba(255,68,68,0.2);
        }
        .server-card .description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .server-card .meta {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .server-card .meta span { display: flex; align-items: center; gap: 6px; }
        .server-card .meta .code {
            font-family: 'Courier New', monospace;
            color: var(--accent);
            font-weight: 700;
            background: rgba(0,230,118,0.08);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid rgba(0,230,118,0.1);
        }
        .server-card .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid var(--border-glass);
        }
        .btn-icon {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .btn-icon:hover { transform: translateY(-2px); }
        .btn-icon.edit:hover { border-color: #4fc3f7; color: #4fc3f7; background: rgba(79,195,247,0.08); }
        .btn-icon.toggle:hover { border-color: #ff9800; color: #ff9800; background: rgba(255,152,0,0.08); }
        .btn-icon.copy:hover { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.08); }
        .btn-icon.delete:hover { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.08); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1/-1;
        }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { margin-bottom: 8px; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            max-width: 500px;
            width: 100%;
            padding: 32px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            animation: modalFadeIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalFadeIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal .input-group { margin: 12px 0; }
        .modal .input-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .modal .input-group input,
        .modal .input-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .modal .input-group input:focus,
        .modal .input-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0,230,118,0.06);
        }
        .modal .input-group textarea { resize: vertical; min-height: 60px; }
        .modal .input-group .code-preview {
            background: rgba(0,230,118,0.05);
            border: 1px solid rgba(0,230,118,0.1);
            border-radius: 12px;
            padding: 10px 14px;
            font-family: 'Courier New', monospace;
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        #particles-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
        }
        .toast {
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            border-left: 4px solid var(--accent);
            padding: 14px 20px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            margin-top: 10px;
            animation: toastSlideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.error { border-left-color: #ff4444; }
        @keyframes toastSlideIn {
            0% { opacity: 0; transform: translateX(50px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .toast-exit {
            animation: toastSlideOut 0.3s ease forwards;
        }
        @keyframes toastSlideOut {
            0% { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(50px) scale(0.95); }
        }
        @media (max-width: 768px) {
            .servers-container { padding: 16px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
            .server-grid { grid-template-columns: 1fr; }
            .modal { padding: 20px; }
        }
        @media (max-width: 480px) {
            .server-card .card-top { flex-direction: column; gap: 8px; }
            .server-card .actions { flex-direction: column; }
            .server-card .actions .btn-icon { justify-content: center; }
        }
    </style>
</head>
<body>
    <body data-theme="dark"></body>
    <canvas id="particles-canvas"></canvas>

    <div class="app-layout">
        <aside class="sidebar glass admin-sidebar">
            <div class="sidebar-brand">
                <img src="assets/images/logo.png" alt="QuizNexus" style="width:50px;height:50px;object-fit:contain;border-radius:12px;">
                <span class="brand-text">Admin<span class="accent">Panel</span></span>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
                <a href="manage-servers.html" class="nav-item active"><i class="fas fa-server"></i> Servers</a>
                <a href="manage-quiz.html" class="nav-item"><i class="fas fa-puzzle-piece"></i> Quizzes</a>
                <a href="manage-quiz.html" class="nav-item"><i class="fas fa-database"></i> Question Bank</a>
                <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
                <a href="analytics.html" class="nav-item"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
                <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content page-enter">
            <header class="dashboard-header">
                <h1>🖥️ Manage Servers</h1>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                </div>
            </header>

            <div class="servers-container glass">
                <div class="top-bar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchServers" placeholder="Search servers..." oninput="searchServers()">
                    </div>
                    <button class="action-btn primary" onclick="openServerModal()"><i class="fas fa-plus"></i> Create Server</button>
                </div>

                <div class="server-grid" id="serversList">
                    <!-- Rendered by JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="serverModal">
        <div class="modal glass">
            <h3 id="modalTitle" style="margin-bottom:16px;">📝 Create New Server</h3>
            <form id="serverForm" onsubmit="event.preventDefault(); saveServer();">
                <div class="input-group">
                    <label>Server Name *</label>
                    <input type="text" id="serverName" placeholder="e.g. AI & Data Science" required>
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="serverDescription" placeholder="Describe this server..." rows="2"></textarea>
                </div>
                <div class="input-group">
                    <label>Server Code * (Auto-generated)</label>
                    <input type="text" id="serverCode" placeholder="Auto-generated code" readonly>
                    <small style="color:var(--text-secondary);font-size:0.75rem;">Code will be auto-generated based on server name</small>
                </div>
                <div class="input-group" id="codePreviewGroup" style="display:none;">
                    <label>Preview Code</label>
                    <div class="code-preview" id="codePreview">AIDS-101</div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="action-btn glass" onclick="closeServerModal()">Cancel</button>
                    <button type="submit" class="action-btn primary"><i class="fas fa-save"></i> Save Server</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/storage.js"></script>
    <script>
        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) {
                const newContainer = document.createElement('div');
                newContainer.id = 'toastContainer';
                newContainer.className = 'toast-container';
                document.body.appendChild(newContainer);
                return showToast(message, type);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function redirectTo(page) {
            window.location.href = page;
        }

        function logout() {
            localStorage.removeItem('quiznexus_admin_session');
            localStorage.removeItem('quiznexus_current_user');
            showToast('Logged out');
            setTimeout(() => redirectTo('login.html'), 400);
        }

        function toggleTheme() {
            const settings = DB.getSettings();
            const newTheme = settings.theme === 'dark' ? 'light' : 'dark';
            settings.theme = newTheme;
            DB.saveSettings(settings);
            applyTheme(newTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-toggle i').forEach(icon => {
                icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            });
            document.body.style.background = theme === 'light' 
                ? 'radial-gradient(ellipse at 20% 20%, #e8f5e9, #c8e6c9)' 
                : 'radial-gradient(circle at 20% 20%, #132b17, #051007)';
        }

        // ============================================================
        //  SERVER MANAGEMENT FUNCTIONS
        // ============================================================
        let allServers = [];
        let editingServerId = null;

        // ===== GENERATE SERVER CODE =====
        function generateServerCode(serverName) {
            if (!serverName || serverName.trim() === '') return '';
            
            const name = serverName.trim();
            const words = name.split(' ');
            let prefix = '';
            
            if (words.length === 1) {
                prefix = words[0].substring(0, 3).toUpperCase();
            } else {
                for (let i = 0; i < Math.min(words.length, 3); i++) {
                    if (words[i].length > 0) {
                        prefix += words[i].charAt(0).toUpperCase();
                    }
                }
            }
            
            if (prefix.length < 2) prefix = 'SRV';
            
            const existing = DB.getServers().filter(s => s.code && s.code.startsWith(prefix));
            const count = existing.length + 1;
            
            return `${prefix}-${String(count).padStart(3, '0')}`;
        }

        function loadServers() {
            allServers = DB.getServers();
            renderServers(allServers);
        }

        function renderServers(servers) {
            const container = document.getElementById('serversList');
            if (!container) return;

            if (servers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-server"></i>
                        <h3>No Servers Created Yet</h3>
                        <p style="color:var(--text-secondary);">Create your first server to organize quizzes by campus or course.</p>
                        <button class="action-btn primary" onclick="openServerModal()" style="margin-top:16px;">
                            <i class="fas fa-plus"></i> Create Server
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = servers.map(server => {
                const users = DB.getUsers().filter(u => u.serverId === server.id);
                const quizzes = DB.getQuizzes().filter(q => q.serverId === server.id);
                return `
                    <div class="server-card">
                        <div class="card-top">
                            <div class="name">${server.name}</div>
                            <span class="badge ${server.isActive ? 'active' : 'inactive'}">
                                ${server.isActive ? '🟢 Active' : '🔴 Inactive'}
                            </span>
                        </div>
                        <div class="description">${server.description || 'No description'}</div>
                        <div class="meta">
                            <span><i class="fas fa-code"></i> <span class="code">${server.code || 'N/A'}</span></span>
                            <span><i class="fas fa-users"></i> ${users.length} users</span>
                            <span><i class="fas fa-puzzle-piece"></i> ${quizzes.length} quizzes</span>
                            <span><i class="fas fa-calendar"></i> ${new Date(server.createdAt).toLocaleDateString()}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-icon edit" onclick="openServerModal('${server.id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn-icon toggle" onclick="toggleServerStatus('${server.id}')">
                                <i class="fas ${server.isActive ? 'fa-pause' : 'fa-play'}"></i>
                                ${server.isActive ? 'Disable' : 'Enable'}
                            </button>
                            <button class="btn-icon copy" onclick="copyServerCode('${server.code}')" title="Copy Server Code">
                                <i class="fas fa-copy"></i> Copy Code
                            </button>
                            <button class="btn-icon delete" onclick="deleteServer('${server.id}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function searchServers() {
            const query = document.getElementById('searchServers').value.toLowerCase();
            const filtered = allServers.filter(s => 
                s.name.toLowerCase().includes(query) ||
                (s.description || '').toLowerCase().includes(query) ||
                (s.code || '').toLowerCase().includes(query)
            );
            renderServers(filtered);
        }

        // ===== OPEN MODAL =====
        function openServerModal(serverId = null) {
            editingServerId = serverId;
            const modal = document.getElementById('serverModal');
            const title = document.getElementById('modalTitle');
            
            // Remove old event listener
            const nameInput = document.getElementById('serverName');
            const newNameInput = nameInput.cloneNode(true);
            nameInput.parentNode.replaceChild(newNameInput, nameInput);
            
            if (serverId) {
                const server = DB.getServerById(serverId);
                if (!server) { showToast('Server not found!', 'error'); return; }
                title.textContent = '✏️ Edit Server';
                document.getElementById('serverName').value = server.name;
                document.getElementById('serverDescription').value = server.description || '';
                document.getElementById('serverCode').value = server.code || '';
                document.getElementById('codePreviewGroup').style.display = 'block';
                document.getElementById('codePreview').textContent = server.code || 'N/A';
            } else {
                title.textContent = '📝 Create New Server';
                document.getElementById('serverForm').reset();
                document.getElementById('serverCode').value = '';
                document.getElementById('codePreviewGroup').style.display = 'none';
                
                const nameInputNew = document.getElementById('serverName');
                nameInputNew.addEventListener('input', function() {
                    const name = this.value.trim();
                    if (name) {
                        const generatedCode = generateServerCode(name);
                        document.getElementById('serverCode').value = generatedCode;
                        document.getElementById('codePreviewGroup').style.display = 'block';
                        document.getElementById('codePreview').textContent = generatedCode;
                    } else {
                        document.getElementById('serverCode').value = '';
                        document.getElementById('codePreviewGroup').style.display = 'none';
                    }
                });
            }
            modal.classList.add('active');
        }

        function closeServerModal() {
            document.getElementById('serverModal').classList.remove('active');
            editingServerId = null;
        }

        function saveServer() {
            const name = document.getElementById('serverName').value.trim();
            const description = document.getElementById('serverDescription').value.trim();
            const code = document.getElementById('serverCode').value.trim();

            if (!name) {
                showToast('Please enter server name', 'error');
                return;
            }

            let finalCode = code;
            if (!finalCode) {
                finalCode = generateServerCode(name);
            }

            if (editingServerId) {
                try {
                    const updated = DB.updateServer(editingServerId, { 
                        name, 
                        description,
                        code: finalCode.toUpperCase()
                    });
                    if (updated) {
                        showToast('✅ Server updated successfully!');
                    }
                } catch(e) {
                    showToast(e.message, 'error');
                    return;
                }
            } else {
                try {
                    DB.createServer({ name, description, code: finalCode });
                    showToast('✅ Server created successfully!');
                } catch(e) {
                    showToast(e.message, 'error');
                    return;
                }
            }

            closeServerModal();
            loadServers();
        }

        function toggleServerStatus(serverId) {
            const server = DB.getServerById(serverId);
            if (!server) { showToast('Server not found!', 'error'); return; }
            
            const newStatus = !server.isActive;
            DB.updateServer(serverId, { isActive: newStatus });
            showToast(`✅ Server ${newStatus ? 'enabled' : 'disabled'} successfully!`);
            loadServers();
        }

        function deleteServer(serverId) {
            if (!confirm('⚠️ Delete this server permanently? This will not delete quizzes or users.')) return;
            
            const server = DB.getServerById(serverId);
            if (!server) { showToast('Server not found!', 'error'); return; }
            
            DB.deleteServer(serverId);
            showToast('🗑️ Server deleted successfully!');
            loadServers();
        }

        function copyServerCode(code) {
            if (!code) { showToast('No code to copy', 'error'); return; }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).then(() => {
                    showToast('📋 Server code copied: ' + code);
                }).catch(() => {
                    fallbackCopy(code);
                });
            } else {
                fallbackCopy(code);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('📋 Server code copied: ' + text);
        }

        // ============================================================
        //  PARTICLES
        // ============================================================
        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            const particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 118, ${p.opacity})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // ============================================================
        //  PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('quiznexus_admin_session')) {
                redirectTo('admin-login.html');
                return;
            }
            const settings = DB.getSettings();
            if (settings.theme) applyTheme(settings.theme);
            initParticles();
            loadServers();
        });

        // ============================================================
        //  GLOBAL EXPORTS
        // ============================================================
        window.openServerModal = openServerModal;
        window.closeServerModal = closeServerModal;
        window.saveServer = saveServer;
        window.toggleServerStatus = toggleServerStatus;
        window.deleteServer = deleteServer;
        window.searchServers = searchServers;
        window.loadServers = loadServers;
        window.copyServerCode = copyServerCode;
        window.generateServerCode = generateServerCode;
        window.logout = logout;
        window.toggleTheme = toggleTheme;
    </script>
</body>
