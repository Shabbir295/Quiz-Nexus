<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Theme Meta Tag -->
<meta name="theme-color" content="#0b1a0e">
    <!-- Prevent page zoom and scroll issues -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<!-- Theme Color for Mobile -->
<meta name="theme-color" content="#00e676">
<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="assets/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard · QuizNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ===== FAVICON - Browser Tab Logo ===== -->
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 20%, #132b17, #051007);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e2f0e5;
        }
        .app-layout {
            display: flex;
            min-height: 100vh;
            padding: 16px;
            gap: 16px;
        }
        .glass {
            background: rgba(15, 32, 19, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 100, 0.15);
            border-radius: 28px;
            transition: 0.3s;
        }
        .glass:hover { border-color: rgba(0, 230, 118, 0.3); }
        .sidebar {
            width: 240px;
            padding: 24px 16px;
            position: sticky;
            top: 16px;
            height: calc(100vh - 32px);
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px 24px;
            border-bottom: 1px solid rgba(0, 255, 100, 0.15);
            margin-bottom: 20px;
        }
        .logo-icon {
            background: #ff6b35;
            color: #0b1a0e;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
        }
        .logo-name {
            font-weight: 700;
            font-size: 1.4rem;
            color: #e2f0e5;
        }
        .logo-name .accent { color: #ff6b35; }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 16px;
            color: #8fb89a;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
            cursor: pointer;
        }
        .nav-item:hover { background: rgba(0, 230, 118, 0.08); color: #e2f0e5; }
        .nav-item.active { background: rgba(255, 107, 53, 0.15); color: #ff6b35; }
        .nav-item i { width: 20px; text-align: center; }
        .main-content {
            flex: 1;
            padding: 0 8px 20px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .dashboard-header h1 { font-size: 2rem; font-weight: 700; }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .greeting { color: #8fb89a; }
        .theme-toggle {
            background: transparent;
            border: 1px solid rgba(0, 255, 100, 0.15);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #e2f0e5;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { background: rgba(0, 230, 118, 0.1); border-color: #00e676; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 107, 53, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #ff6b35;
            flex-shrink: 0;
        }
        .stat-info h3 { font-size: 1.4rem; font-weight: 700; }
        .stat-info p { color: #8fb89a; font-size: 0.8rem; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-card { padding: 24px; }
        .chart-card h3 { margin-bottom: 16px; }
        .activity-card { padding: 24px; }
        .activity-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 255, 100, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
        }
        .toast {
            background: rgba(20, 40, 25, 0.92);
            backdrop-filter: blur(14px);
            border-left: 4px solid #ff6b35;
            padding: 14px 20px;
            border-radius: 16px;
            color: #e2f0e5;
            margin-top: 10px;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; padding: 10px; }
            .sidebar { width: 100%; height: auto; position: relative; top: 0; padding: 16px; }
            .sidebar-nav { flex-direction: row; flex-wrap: wrap; }
            .nav-item { padding: 6px 12px; font-size: 0.85rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <body data-theme="dark"></body>
    <canvas id="particles-canvas"></canvas>
    <div class="app-layout">
        <aside class="sidebar glass admin-sidebar">
            <div class="sidebar-brand">
                <!-- ===== BIG SIDEBAR LOGO - 60px ===== -->
                <img src="assets/images/logo.png" alt="QuizNexus" style="width:60px; height:60px; object-fit:contain; border-radius:12px;">
                <span class="logo-name">Admin<span class="accent">Panel</span></span>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item active"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
                <a href="manage-quiz.html" class="nav-item"><i class="fas fa-puzzle-piece"></i> Quizzes</a>
                <a href="manage-quiz.html" class="nav-item"><i class="fas fa-question-circle"></i> Questions</a>
                <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
                <a href="analytics.html" class="nav-item"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
                <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <h1>Admin Dashboard</h1>
                <div class="header-actions">
                    <span class="greeting">Welcome, <strong>Administrator</strong>!</span>
                    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-info">
                        <h3 id="totalUsers">0</h3>
                        <p>Total Users</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fas fa-puzzle-piece"></i></div>
                    <div class="stat-info">
                        <h3 id="totalQuizzes">0</h3>
                        <p>Total Quizzes</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fas fa-question-circle"></i></div>
                    <div class="stat-info">
                        <h3 id="totalQuestions">0</h3>
                        <p>Total Questions</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                    <div class="stat-info">
                        <h3 id="highestScoreAdmin">0</h3>
                        <p>Highest Score</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fas fa-chart-bar"></i></div>
                    <div class="stat-info">
                        <h3 id="avgScoreAdmin">0%</h3>
                        <p>Average Score</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fas fa-user-check"></i></div>
                    <div class="stat-info">
                        <h3 id="activeUsers">0</h3>
                        <p>Active Users</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="glass chart-card">
                    <h3>User Activity</h3>
                    <canvas id="userActivityChart" height="200"></canvas>
                </div>
                <div class="glass chart-card">
                    <h3>Quiz Performance</h3>
                    <canvas id="quizPerformanceChart" height="200"></canvas>
                </div>
            </div>

            <div class="glass activity-card">
                <h3>Recent Activity</h3>
                <div id="recentActivity">
                    <p class="activity-item"><i class="fas fa-clock"></i> Loading...</p>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const DB = {
            USERS: 'quiznexus_users',
            QUIZZES: 'quiznexus_quizzes',
            RESULTS: 'quiznexus_results',
            SETTINGS: 'quiznexus_settings',
            ADMIN_SESSION: 'quiznexus_admin_session',
            getUsers() { return JSON.parse(localStorage.getItem(this.USERS)) || []; },
            getQuizzes() { return JSON.parse(localStorage.getItem(this.QUIZZES)) || []; },
            getResults() { return JSON.parse(localStorage.getItem(this.RESULTS)) || []; },
            getSettings() {
                return JSON.parse(localStorage.getItem(this.SETTINGS)) || {
                    theme: 'dark',
                    accentColor: '#00e676'
                };
            },
            saveSettings(settings) { localStorage.setItem(this.SETTINGS, JSON.stringify(settings)); }
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'error' ? '#ff4444' : '#ff6b35';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(50px)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function redirectTo(page) { window.location.href = page; }

        function logout() {
            localStorage.removeItem('quiznexus_admin_session');
            localStorage.removeItem('quiznexus_current_user');
            showToast('Logged out');
            setTimeout(() => redirectTo('login.html'), 400);
        }

        function toggleTheme() {
            const settings = DB.getSettings();
            const newTheme = settings.theme === 'dark' ? 'light' : 'dark';
            settings.theme = newTheme;
            DB.saveSettings(settings);
            applyTheme(newTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-toggle i').forEach(icon => {
                icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            });
            if (theme === 'light') {
                document.body.style.background = 'radial-gradient(ellipse at 20% 20%, #e8f5e9, #c8e6c9)';
            } else {
                document.body.style.background = 'radial-gradient(circle at 20% 20%, #132b17, #051007)';
            }
        }

        function loadAdminDashboard() {
            const users = DB.getUsers();
            const quizzes = DB.getQuizzes();
            const results = DB.getResults();

            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalQuizzes').textContent = quizzes.length;
            document.getElementById('totalQuestions').textContent = quizzes.reduce((sum, q) => sum + (q.questions?.length || 0), 0);
            const highestScore = results.length > 0 ? Math.max(...results.map(r => r.score)) : 0;
            document.getElementById('highestScoreAdmin').textContent = highestScore;
            const avgScore = results.length > 0 ? (results.reduce((sum, r) => sum + r.percentage, 0) / results.length) : 0;
            document.getElementById('avgScoreAdmin').textContent = avgScore.toFixed(1) + '%';
            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            const activeUsers = new Set(results.filter(r => new Date(r.completedAt) > weekAgo).map(r => r.userId));
            document.getElementById('activeUsers').textContent = activeUsers.size;

            loadAdminCharts(results, quizzes);
            loadRecentActivity(results);
        }

        function loadAdminCharts(results, quizzes) {
            const ctx1 = document.getElementById('userActivityChart');
            if (ctx1) {
                const last30Days = [];
                const today = new Date();
                for (let i = 29; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    last30Days.push(date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                }
                const dailyCounts = last30Days.map(day => {
                    return results.filter(r => new Date(r.completedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) === day).length;
                });
                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: last30Days,
                        datasets: [{
                            label: 'Quiz Attempts',
                            data: dailyCounts,
                            backgroundColor: 'rgba(255, 107, 53, 0.3)',
                            borderColor: '#ff6b35',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                labels: { color: '#a0c9a8' }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: '#a0c9a8' }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#a0c9a8', maxTicksLimit: 10 }
                            }
                        }
                    }
                });
            }

            const ctx2 = document.getElementById('quizPerformanceChart');
            if (ctx2) {
                const topQuizzes = quizzes.slice(0, 10);
                const quizNames = topQuizzes.map(q => q.title.substring(0, 20));
                const avgScores = topQuizzes.map(q => {
                    const quizResults = results.filter(r => r.quizId === q.id);
                    return quizResults.length > 0 ? (quizResults.reduce((sum, r) => sum + r.percentage, 0) / quizResults.length) : 0;
                });
                new Chart(ctx2, {
                    type: 'horizontalBar',
                    data: {
                        labels: quizNames,
                        datasets: [{
                            label: 'Average Score %',
                            data: avgScores,
                            backgroundColor: 'rgba(255, 107, 53, 0.3)',
                            borderColor: '#ff6b35',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: {
                                max: 100,
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: '#a0c9a8' }
                            },
                            y: {
                                grid: { display: false },
                                ticks: { color: '#a0c9a8' }
                            }
                        }
                    }
                });
            }
        }

        function loadRecentActivity(results) {
            const container = document.getElementById('recentActivity');
            if (!container) return;
            const recent = results.sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt)).slice(0, 10);
            if (recent.length === 0) {
                container.innerHTML = '<p class="activity-item"><i class="fas fa-clock"></i> No recent activity</p>';
                return;
            }
            container.innerHTML = recent.map(r => {
                const user = DB.getUsers().find(u => u.id === r.userId);
                return `
                    <div class="activity-item">
                        <i class="fas fa-user-check" style="color:#ff6b35;"></i>
                        <div>
                            <strong>${user ? user.fullName : 'Unknown'}</strong>
                            <span>completed <strong>${r.quizTitle || 'Quiz'}</strong></span>
                            <span style="color:#ff6b35;font-weight:600;">${r.percentage.toFixed(1)}%</span>
                        </div>
                        <span style="margin-left:auto;color:#8fb89a;font-size:0.8rem;">
                            ${new Date(r.completedAt).toLocaleDateString()}
                        </span>
                    </div>
                `;
            }).join('');
        }

        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            const particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 118, ${p.opacity})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('quiznexus_admin_session')) {
                redirectTo('admin-login.html');
                return;
            }
            initParticles();
            const settings = DB.getSettings();
            if (settings.theme) applyTheme(settings.theme);
            loadAdminDashboard();
        });

        window.logout = logout;
        window.toggleTheme = toggleTheme;
    </script>
</body>
</html>
