<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Theme Meta Tag -->
<meta name="theme-color" content="#0b1a0e">
    <!-- Prevent page zoom and scroll issues -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<!-- Theme Color for Mobile -->
<meta name="theme-color" content="#00e676">
<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="assets/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizNexus · Learn • Practice • Compete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ===== FAVICON - Browser Tab Logo (Bada & Clear) ===== -->
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 20%, #132b17, #051007);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e2f0e5;
        }
        #loader-overlay {
            position: fixed;
            inset: 0;
            background: #061009;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .loader-container {
            text-align: center;
            max-width: 400px;
            padding: 40px;
        }
        .logo-animation {
            animation: fadeScale 1s ease;
        }
        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .logo-text {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: #e2f0e5;
        }
        .logo-text .accent { color: #00e676; }
        .logo-tagline {
            color: #8fb89a;
            font-size: 1rem;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        .loader-bar-container {
            width: 100%;
            height: 4px;
            background: #1a2d1f;
            border-radius: 12px;
            margin: 24px 0;
            overflow: hidden;
        }
        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e676, #00c853);
            border-radius: 12px;
            animation: loadBar 2.5s ease forwards;
        }
        @keyframes loadBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .typing-container {
            font-size: 1.1rem;
            color: #8fb89a;
            min-height: 30px;
        }
        .cursor {
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <body data-theme="dark"></body>
    <canvas id="particles-canvas"></canvas>
    <div id="loader-overlay">
        <div class="loader-container">
            <div class="logo-animation">
                <!-- ===== BIG LOGO - 250px ===== -->
                <img src="assets/images/logo.png" alt="QuizNexus Logo" style="width:250px; height:250px; object-fit:contain; display:block; margin:0 auto 20px;">
                <h1 class="logo-text">Quiz<span class="accent">Nexus</span></h1>
                <p class="logo-tagline">Learn • Practice • Compete</p>
            </div>
            <div class="loader-bar-container">
                <div class="loader-bar" id="loaderBar"></div>
            </div>
            <div class="typing-container">
                <span id="typingText"></span>
                <span class="cursor">|</span>
            </div>
        </div>
    </div>

    <script>
        // Database & App Logic
        const DB = {
            USERS: 'quiznexus_users',
            QUIZZES: 'quiznexus_quizzes',
            RESULTS: 'quiznexus_results',
            SETTINGS: 'quiznexus_settings',
            CURRENT_USER: 'quiznexus_current_user',
            ADMIN_SESSION: 'quiznexus_admin_session',
            getUsers() { return JSON.parse(localStorage.getItem(this.USERS)) || []; },
            saveUsers(users) { localStorage.setItem(this.USERS, JSON.stringify(users)); },
            getUserById(id) { return this.getUsers().find(u => u.id === id) || null; },
            getUserByRollNumber(rollNumber) { return this.getUsers().find(u => u.rollNumber === rollNumber) || null; },
            getUserByEmail(email) { return this.getUsers().find(u => u.email === email) || null; },
            createUser(userData) {
                const users = this.getUsers();
                const newUser = {
                    id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    fullName: userData.fullName,
                    rollNumber: userData.rollNumber,
                    password: userData.password,
                    email: userData.email || '',
                    phone: userData.phone || '',
                    avatar: userData.avatar || this.getDefaultAvatar(),
                    xp: 0,
                    streak: 0,
                    longestStreak: 0,
                    totalScore: 0,
                    quizzesTaken: [],
                    achievements: [],
                    createdAt: new Date().toISOString(),
                    isActive: true,
                    isBanned: false
                };
                users.push(newUser);
                this.saveUsers(users);
                return newUser;
            },
            updateUser(id, updates) {
                const users = this.getUsers();
                const index = users.findIndex(u => u.id === id);
                if (index === -1) return null;
                users[index] = { ...users[index], ...updates };
                this.saveUsers(users);
                return users[index];
            },
            deleteUser(id) {
                const users = this.getUsers();
                const filtered = users.filter(u => u.id !== id);
                this.saveUsers(filtered);
                return filtered;
            },
            getQuizzes() { return JSON.parse(localStorage.getItem(this.QUIZZES)) || []; },
            saveQuizzes(quizzes) { localStorage.setItem(this.QUIZZES, JSON.stringify(quizzes)); },
            getQuizById(id) { return this.getQuizzes().find(q => q.id === id) || null; },
            createQuiz(quizData) {
                const quizzes = this.getQuizzes();
                const newQuiz = {
                    id: 'quiz_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    title: quizData.title,
                    description: quizData.description || '',
                    duration: parseInt(quizData.duration) || 10,
                    questions: quizData.questions || [],
                    published: quizData.published !== undefined ? quizData.published : true,
                    createdBy: quizData.createdBy || 'admin',
                    createdAt: new Date().toISOString(),
                    totalAttempts: 0,
                    averageScore: 0
                };
                quizzes.push(newQuiz);
                this.saveQuizzes(quizzes);
                return newQuiz;
            },
            updateQuiz(id, updates) {
                const quizzes = this.getQuizzes();
                const index = quizzes.findIndex(q => q.id === id);
                if (index === -1) return null;
                quizzes[index] = { ...quizzes[index], ...updates };
                this.saveQuizzes(quizzes);
                return quizzes[index];
            },
            deleteQuiz(id) {
                const quizzes = this.getQuizzes();
                const filtered = quizzes.filter(q => q.id !== id);
                this.saveQuizzes(filtered);
                return filtered;
            },
            getResults() { return JSON.parse(localStorage.getItem(this.RESULTS)) || []; },
            saveResults(results) { localStorage.setItem(this.RESULTS, JSON.stringify(results)); },
            getResultsByUserId(userId) { return this.getResults().filter(r => r.userId === userId); },
            createResult(resultData) {
                const results = this.getResults();
                const newResult = {
                    id: 'result_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    userId: resultData.userId,
                    quizId: resultData.quizId,
                    quizTitle: resultData.quizTitle || '',
                    score: resultData.score || 0,
                    total: resultData.total || 0,
                    percentage: resultData.percentage || 0,
                    correct: resultData.correct || 0,
                    wrong: resultData.wrong || 0,
                    skipped: resultData.skipped || 0,
                    timeTaken: resultData.timeTaken || 0,
                    answers: resultData.answers || [],
                    completedAt: new Date().toISOString()
                };
                results.push(newResult);
                this.saveResults(results);
                const user = this.getUserById(resultData.userId);
                if (user) {
                    this.updateUser(resultData.userId, {
                        totalScore: (user.totalScore || 0) + resultData.score,
                        quizzesTaken: [...(user.quizzesTaken || []), resultData.quizId],
                        xp: (user.xp || 0) + Math.floor(resultData.score * 10)
                    });
                }
                return newResult;
            },
            getSettings() {
                return JSON.parse(localStorage.getItem(this.SETTINGS)) || {
                    theme: 'dark',
                    accentColor: '#00e676',
                    animations: true,
                    notifications: true,
                    sound: true,
                    fontSize: 'medium',
                    language: 'en'
                };
            },
            saveSettings(settings) { localStorage.setItem(this.SETTINGS, JSON.stringify(settings)); },
            getCurrentUser() {
                const data = localStorage.getItem(this.CURRENT_USER);
                return data ? JSON.parse(data) : null;
            },
            setCurrentUser(user) { localStorage.setItem(this.CURRENT_USER, JSON.stringify(user)); },
            clearCurrentUser() { localStorage.removeItem(this.CURRENT_USER); },
            isAdminLoggedIn() { return localStorage.getItem(this.ADMIN_SESSION) === 'true'; },
            setAdminSession(value) { localStorage.setItem(this.ADMIN_SESSION, JSON.stringify(value)); },
            getDefaultAvatar() {
                let avatar = localStorage.getItem('defaultAvatar');
                if (avatar) return avatar;
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    const ctx = canvas.getContext('2d');
                    const gradient = ctx.createRadialGradient(100, 100, 0, 100, 100, 100);
                    gradient.addColorStop(0, '#00e676');
                    gradient.addColorStop(1, '#008c3a');
                    ctx.beginPath();
                    ctx.arc(100, 100, 100, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath();
                    ctx.arc(100, 70, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(100, 160, 45, 35, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = 'bold 60px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('QN', 100, 120);
                    avatar = canvas.toDataURL('image/png');
                    localStorage.setItem('defaultAvatar', avatar);
                    return avatar;
                } catch(e) {
                    return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%2300e676"/><text x="50" y="65" font-size="50" text-anchor="middle" fill="white" font-family="Arial">QN</text></svg>';
                }
            },
            clearAll() {
                localStorage.removeItem(this.USERS);
                localStorage.removeItem(this.QUIZZES);
                localStorage.removeItem(this.RESULTS);
                localStorage.removeItem(this.SETTINGS);
                localStorage.removeItem(this.CURRENT_USER);
                localStorage.removeItem(this.ADMIN_SESSION);
                localStorage.removeItem('defaultAvatar');
            }
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        function redirectTo(page) { window.location.href = page; }

        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            const particles = [];
            const count = Math.min(80, Math.floor((w * h) / 20000));
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(0, 230, 118, ${0.05 * (1 - dist / 150)})`;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 118, ${p.opacity})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        document.addEventListener('DOMContentLoaded', function() {
            initParticles();
            const texts = ['Learn • Practice • Compete', 'Knowledge is Power', 'Quiz Master'];
            let textIndex = 0, charIndex = 0, isDeleting = false;
            const typingElement = document.getElementById('typingText');
            function typeEffect() {
                if (!typingElement) return;
                const currentText = texts[textIndex];
                if (!isDeleting) {
                    typingElement.textContent = currentText.substring(0, charIndex + 1);
                    charIndex++;
                    if (charIndex === currentText.length) {
                        isDeleting = true;
                        setTimeout(typeEffect, 2000);
                        return;
                    }
                } else {
                    typingElement.textContent = currentText.substring(0, charIndex);
                    charIndex--;
                    if (charIndex < 0) {
                        isDeleting = false;
                        textIndex = (textIndex + 1) % texts.length;
                        setTimeout(typeEffect, 500);
                        return;
                    }
                }
                setTimeout(typeEffect, isDeleting ? 50 : 100);
            }
            typeEffect();
            const loader = document.getElementById('loader-overlay');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    window.location.href = 'login.html';
                }, 800);
            }, 3500);
            if (DB.getUsers().length === 0) {
                DB.createUser({
                    fullName: 'Admin User',
                    rollNumber: 'ADMIN001',
                    password: 'admin123',
                    email: 'admin@quiznexus.com',
                    phone: '1234567890'
                });
                DB.createQuiz({
                    title: 'JavaScript Basics',
                    description: 'Test your knowledge of JavaScript fundamentals',
                    duration: 10,
                    published: true,
                    questions: [
                        { id: 'q1', text: 'What is the output of console.log(typeof [])?', options: ['array', 'object', 'undefined', 'null'], correct: 1, explanation: 'In JavaScript, arrays are objects' },
                        { id: 'q2', text: 'Which method is used to add an element to the end of an array?', options: ['push()', 'pop()', 'shift()', 'unshift()'], correct: 0, explanation: 'push() adds elements to the end of an array' },
                        { id: 'q3', text: 'What is the correct way to write a function in JavaScript?', options: ['function myFunc() {}', 'function:myFunc() {}', 'func myFunc() {}', '() => function {}'], correct: 0, explanation: 'function myFunc() {} is the standard function declaration' }
                    ]
                });
                console.log('✅ QuizNexus initialized with sample data');
            }
            console.log('🚀 QuizNexus loaded successfully!');
        });
    </script>
</body>
</html>
