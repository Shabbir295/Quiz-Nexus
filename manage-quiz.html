<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Theme Meta Tag -->
<meta name="theme-color" content="#0b1a0e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Quizzes · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <style>
        .quizzes-container { padding: 28px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }
        .top-bar .left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex: 1; }
        .top-bar .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 350px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: 60px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            opacity: 0.5;
        }
        .filter-select {
            padding: 9px 16px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: 60px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            min-width: 130px;
        }
        .filter-select:focus { border-color: var(--accent); }
        .action-btn {
            padding: 9px 18px;
            border-radius: 60px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn.primary {
            background: linear-gradient(145deg, #00c853, #00e676);
            color: #0b1a0e;
            box-shadow: 0 4px 16px rgba(0,230,118,0.25);
        }
        .action-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,230,118,0.35); }
        .action-btn.glass {
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
        }
        .action-btn.glass:hover { border-color: var(--accent); transform: translateY(-2px); }
        .action-btn.create {
            background: linear-gradient(145deg, #ff6b35, #ff4500);
            color: white;
            box-shadow: 0 4px 16px rgba(255,107,53,0.3);
            padding: 10px 24px;
            font-size: 0.95rem;
        }
        .action-btn.create:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,107,53,0.4); }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .quiz-card {
            padding: 24px;
            border-radius: var(--radius);
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            transition: all 0.3s;
        }
        .quiz-card:hover::before { opacity: 1; }
        .quiz-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glass-hover);
            box-shadow: var(--shadow-soft), var(--neon-glow);
        }
        .quiz-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .quiz-card .card-top .title { font-size: 1.15rem; font-weight: 700; }
        .quiz-card .card-top .badge {
            font-size: 0.65rem;
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .quiz-card .card-top .badge.published {
            background: rgba(0,230,118,0.15);
            color: #00e676;
            border: 1px solid rgba(0,230,118,0.2);
        }
        .quiz-card .card-top .badge.hidden {
            background: rgba(255,255,255,0.05);
            color: #8fb89a;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .quiz-card .description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .quiz-card .meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .quiz-card .meta span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .quiz-card .meta span i { font-size: 0.85rem; opacity: 0.6; }
        .quiz-card .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid var(--border-glass);
        }
        .btn-icon {
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: rgba(0,230,118,0.05);
            transform: translateY(-2px);
        }
        .btn-icon.danger:hover { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.05); }
        .btn-icon.success { color: #00e676; }
        .btn-icon.success:hover { border-color: #00e676; background: rgba(0,230,118,0.08); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            max-width: 750px;
            width: 100%;
            padding: 32px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            max-height: 90vh;
            overflow-y: auto;
            animation: modalFadeIn 0.3s ease;
            margin: auto;
        }
        @keyframes modalFadeIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal .input-group { margin-bottom: 12px; }
        .modal .input-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .modal .input-group input,
        .modal .input-group select,
        .modal .input-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .modal .input-group input:focus,
        .modal .input-group select:focus,
        .modal .input-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0,230,118,0.06);
        }
        .modal .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .modal .question-builder {
            background: rgba(0,0,0,0.1);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            border: 1px solid var(--border-glass);
        }
        .modal .question-builder .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .modal .question-builder .q-header h4 { color: var(--accent); font-size: 0.95rem; }
        .modal .question-builder .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .modal .question-builder .options-grid .opt-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal .question-builder .options-grid .opt-input label {
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 20px;
            font-size: 0.85rem;
        }
        .modal .question-builder .options-grid .opt-input input {
            flex: 1;
            padding: 6px 10px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: 8px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .modal .question-builder .options-grid .opt-input input:focus { border-color: var(--accent); }
        .modal .question-builder .correct-option {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,230,118,0.05);
            border-radius: 8px;
        }
        .modal .question-builder .correct-option label {
            color: var(--accent);
            font-weight: 500;
            font-size: 0.85rem;
        }
        .modal .question-builder .correct-option select {
            padding: 4px 10px;
            border-radius: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            color: var(--text-primary);
            outline: none;
        }
        .modal .question-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            margin-bottom: 6px;
            border-left: 3px solid var(--accent);
        }
        .modal .question-list-item .q-info { flex: 1; }
        .modal .question-list-item .q-info strong { display: block; font-size: 0.9rem; }
        .modal .question-list-item .q-info small { color: var(--text-secondary); font-size: 0.8rem; }
        .modal .question-list-item .q-actions { display: flex; gap: 6px; }

        .modal-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }

        .question-bank {
            margin-top: 24px;
            padding: 24px;
            border-radius: var(--radius);
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
        }
        .question-bank .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .question-bank .bank-header h3 { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        .question-bank .bank-questions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .question-bank .bank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.1);
            border-radius: 12px;
            transition: all 0.3s;
            border-left: 3px solid var(--accent);
        }
        .question-bank .bank-item:hover { background: rgba(0,230,118,0.04); }
        .question-bank .bank-item .q-text { flex: 1; font-size: 0.9rem; }
        .question-bank .bank-item .q-options { font-size: 0.75rem; color: var(--text-secondary); }
        .question-bank .bank-item .q-actions { display: flex; gap: 6px; }

        #particles-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
        }
        .toast {
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            border-left: 4px solid var(--accent);
            padding: 14px 20px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            margin-top: 10px;
            animation: toastSlideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.error { border-left-color: #ff4444; }
        @keyframes toastSlideIn {
            0% { opacity: 0; transform: translateX(50px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .toast-exit { animation: toastSlideOut 0.3s ease forwards; }
        @keyframes toastSlideOut {
            0% { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(50px) scale(0.95); }
        }
        @media (max-width: 768px) {
            .quizzes-container { padding: 16px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
            .quiz-grid { grid-template-columns: 1fr; }
            .modal { padding: 20px; max-height: 95vh; }
            .modal .input-row { grid-template-columns: 1fr; }
            .modal .question-builder .options-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .quiz-card .card-top { flex-direction: column; gap: 8px; }
            .quiz-card .card-actions { flex-direction: column; }
            .quiz-card .card-actions .btn-icon { justify-content: center; }
            .modal { padding: 16px; }
            .modal .input-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <body data-theme="dark"></body>
    <canvas id="particles-canvas"></canvas>

    <div class="app-layout">
        <aside class="sidebar glass admin-sidebar">
            <div class="sidebar-brand">
                <img src="assets/images/logo.png" alt="QuizNexus" style="width:50px;height:50px;object-fit:contain;border-radius:12px;">
                <span class="brand-text">Admin<span class="accent">Panel</span></span>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
                <a href="manage-servers.html" class="nav-item"><i class="fas fa-server"></i> Servers</a>
                <a href="manage-quiz.html" class="nav-item active"><i class="fas fa-puzzle-piece"></i> Quizzes</a>
                <a href="manage-quiz.html" class="nav-item"><i class="fas fa-database"></i> Question Bank</a>
                <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
                <a href="analytics.html" class="nav-item"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
                <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content page-enter">
            <header class="dashboard-header">
                <h1>📝 Manage Quizzes</h1>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                </div>
            </header>

            <div class="quizzes-container glass">
                <div class="top-bar">
                    <div class="left">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchQuizzes" placeholder="Search quizzes..." oninput="filterQuizzes()">
                        </div>
                        <div class="filter-group" style="display:flex;gap:8px;flex-wrap:wrap;">
                            <select id="categoryFilter" class="filter-select" onchange="filterQuizzes()">
                                <option value="">All Categories</option>
                            </select>
                            <select id="statusFilter" class="filter-select" onchange="filterQuizzes()">
                                <option value="">All Status</option>
                                <option value="published">Published</option>
                                <option value="hidden">Hidden</option>
                            </select>
                            <select id="serverFilter" class="filter-select" onchange="filterQuizzes()">
                                <option value="">All Servers</option>
                            </select>
                        </div>
                    </div>
                    <div class="right">
                        <button class="action-btn glass" onclick="importQuizJSON()"><i class="fas fa-file-import"></i> Import</button>
                        <button class="action-btn glass" onclick="exportQuizJSON()"><i class="fas fa-file-export"></i> Export</button>
                        <button class="action-btn glass" onclick="toggleQuestionBank()"><i class="fas fa-database"></i> Bank</button>
                        <button class="action-btn create" onclick="openQuizBuilder()"><i class="fas fa-plus"></i> Create Quiz</button>
                    </div>
                </div>

                <div class="quiz-grid" id="quizGrid">
                    <!-- Rendered by JavaScript -->
                </div>

                <div class="question-bank" id="questionBankPanel" style="display:none;">
                    <div class="bank-header">
                        <h3><i class="fas fa-database" style="color:#4fc3f7;"></i> Question Bank</h3>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="action-btn glass" onclick="addQuestionToBank()"><i class="fas fa-plus"></i> Add</button>
                            <button class="action-btn glass" onclick="toggleQuestionBank()"><i class="fas fa-times"></i> Close</button>
                        </div>
                    </div>
                    <div class="bank-questions" id="questionBankList">
                        <p style="color:var(--text-secondary);text-align:center;padding:20px;">Question bank is empty</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== QUIZ BUILDER MODAL ===== -->
    <div class="modal-overlay" id="quizBuilderModal">
        <div class="modal glass">
            <h3 id="builderTitle" style="margin-bottom:16px;font-size:1.4rem;">📝 Create New Quiz</h3>
            <div class="input-row">
                <div class="input-group">
                    <label>Quiz Title *</label>
                    <input type="text" id="quizTitle" placeholder="e.g. JavaScript Basics">
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <select id="quizCategory">
                        <option value="General">General</option>
                        <option value="Programming">Programming</option>
                        <option value="Science">Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="History">History</option>
                    </select>
                </div>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Duration (minutes) *</label>
                    <input type="number" id="quizDuration" placeholder="10" value="10">
                </div>
                <div class="input-group">
                    <label>Difficulty</label>
                    <select id="quizDifficulty">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>
            <!-- ===== SERVER SELECTION - ZAROORI ===== -->
            <div class="input-group">
                <label>Server *</label>
                <select id="quizServer" required>
                    <option value="">-- Select Server --</option>
                </select>
            </div>
            <div class="input-group">
                <label>Description</label>
                <textarea id="quizDescription" placeholder="Describe this quiz..." rows="2"></textarea>
            </div>

            <hr style="border-color:var(--border-glass);margin:16px 0;">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <h4 style="color:var(--accent);"><i class="fas fa-list"></i> Questions</h4>
                <div style="display:flex;gap:8px;">
                    <button class="action-btn glass" onclick="addQuestionField()"><i class="fas fa-plus"></i> Add</button>
                    <button class="action-btn glass" onclick="addFromBank()"><i class="fas fa-database"></i> From Bank</button>
                </div>
            </div>

            <div id="questionsContainer"></div>
            <div id="addedQuestionsList" style="margin-top:16px;"></div>

            <div style="display:flex;gap:12px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap;">
                <button class="action-btn glass" onclick="closeQuizBuilder()">Cancel</button>
                <button class="action-btn primary" onclick="saveQuizBuilder()"><i class="fas fa-save"></i> Publish Quiz</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/storage.js"></script>
    <script>
        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) {
                const newContainer = document.createElement('div');
                newContainer.id = 'toastContainer';
                newContainer.className = 'toast-container';
                document.body.appendChild(newContainer);
                return showToast(message, type);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function redirectTo(page) {
            window.location.href = page;
        }

        function logout() {
            localStorage.removeItem('quiznexus_admin_session');
            localStorage.removeItem('quiznexus_current_user');
            showToast('Logged out');
            setTimeout(() => redirectTo('login.html'), 400);
        }

        function toggleTheme() {
            const settings = DB.getSettings();
            const newTheme = settings.theme === 'dark' ? 'light' : 'dark';
            settings.theme = newTheme;
            DB.saveSettings(settings);
            applyTheme(newTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-toggle i').forEach(icon => {
                icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            });
            document.body.style.background = theme === 'light' 
                ? 'radial-gradient(ellipse at 20% 20%, #e8f5e9, #c8e6c9)' 
                : 'radial-gradient(circle at 20% 20%, #132b17, #051007)';
        }

        // ============================================================
        //  LOAD SERVERS IN DROPDOWN
        // ============================================================
        function loadServerDropdown() {
            const servers = DB.getActiveServers();
            const select = document.getElementById('quizServer');
            if (!select) return;
            
            select.innerHTML = '<option value="">-- Select Server --</option>';
            servers.forEach(server => {
                const option = document.createElement('option');
                option.value = server.id;
                option.textContent = server.name + ' (' + (server.code || 'N/A') + ')';
                select.appendChild(option);
            });
        }

        // ============================================================
        //  LOAD QUIZZES
        // ============================================================
        let allQuizzes = [];

        function loadQuizzes() {
            allQuizzes = DB.getQuizzes();
            populateServerFilter();
            populateCategoryFilter();
            renderQuizzes(allQuizzes);
        }

        function renderQuizzes(quizzes) {
            const grid = document.getElementById('quizGrid');
            if (!grid) return;
            if (quizzes.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">No quizzes created yet</p>';
                return;
            }
            grid.innerHTML = quizzes.map(quiz => {
                const server = DB.getServerById(quiz.serverId);
                return `
                    <div class="quiz-card">
                        <div class="card-top">
                            <div class="title">${quiz.title}</div>
                            <span class="badge ${quiz.published ? 'published' : 'hidden'}">
                                ${quiz.published ? '✅ Published' : '🔒 Hidden'}
                            </span>
                        </div>
                        <div class="description">${quiz.description || 'No description'}</div>
                        <div class="meta">
                            <span><i class="fas fa-question-circle"></i> ${quiz.questions?.length || 0} questions</span>
                            <span><i class="fas fa-clock"></i> ${quiz.duration} min</span>
                            <span><i class="fas fa-signal"></i> ${quiz.difficulty || 'Medium'}</span>
                            <span><i class="fas fa-tag"></i> ${quiz.category || 'General'}</span>
                            <span><i class="fas fa-server"></i> ${server ? server.name : 'No Server'}</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-icon" onclick="editQuiz('${quiz.id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn-icon success" onclick="duplicateQuiz('${quiz.id}')"><i class="fas fa-copy"></i> Copy</button>
                            <button class="btn-icon" onclick="togglePublish('${quiz.id}')">
                                <i class="fas ${quiz.published ? 'fa-eye-slash' : 'fa-eye'}"></i> ${quiz.published ? 'Hide' : 'Publish'}
                            </button>
                            <button class="btn-icon success" onclick="manageQuestions('${quiz.id}')"><i class="fas fa-list"></i> Questions</button>
                            <button class="btn-icon danger" onclick="deleteQuiz('${quiz.id}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterQuizzes() {
            const search = document.getElementById('searchQuizzes')?.value.toLowerCase() || '';
            const category = document.getElementById('categoryFilter')?.value || '';
            const status = document.getElementById('statusFilter')?.value || '';
            const server = document.getElementById('serverFilter')?.value || '';
            
            let filtered = allQuizzes;
            if (search) {
                filtered = filtered.filter(q => 
                    q.title.toLowerCase().includes(search) || 
                    (q.description || '').toLowerCase().includes(search)
                );
            }
            if (category) {
                filtered = filtered.filter(q => (q.category || 'General') === category);
            }
            if (status) {
                filtered = filtered.filter(q => status === 'published' ? q.published : !q.published);
            }
            if (server) {
                filtered = filtered.filter(q => q.serverId === server);
            }
            renderQuizzes(filtered);
        }

        function populateCategoryFilter() {
            const select = document.getElementById('categoryFilter');
            if (!select) return;
            const categories = new Set(allQuizzes.map(q => q.category || 'General'));
            const currentValue = select.value;
            select.innerHTML = '<option value="">All Categories</option>';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            select.value = currentValue;
        }

        function populateServerFilter() {
            const select = document.getElementById('serverFilter');
            if (!select) return;
            const servers = DB.getServers();
            const currentValue = select.value;
            select.innerHTML = '<option value="">All Servers</option>';
            servers.forEach(server => {
                select.innerHTML += `<option value="${server.id}">${server.name}</option>`;
            });
            select.value = currentValue;
        }

        // ============================================================
        //  QUIZ BUILDER
        // ============================================================
        let editingQuizId = null;
        let tempQuestions = [];

        function openQuizBuilder(quiz = null) {
            editingQuizId = quiz?.id || null;
            tempQuestions = quiz?.questions ? JSON.parse(JSON.stringify(quiz.questions)) : [];
            
            // Load server dropdown FIRST
            loadServerDropdown();
            
            document.getElementById('builderTitle').textContent = quiz ? '✏️ Edit Quiz' : '📝 Create New Quiz';
            document.getElementById('quizTitle').value = quiz?.title || '';
            document.getElementById('quizDescription').value = quiz?.description || '';
            document.getElementById('quizDuration').value = quiz?.duration || 10;
            document.getElementById('quizCategory').value = quiz?.category || 'General';
            document.getElementById('quizDifficulty').value = quiz?.difficulty || 'Medium';
            
            // Set server if editing
            if (quiz && quiz.serverId) {
                document.getElementById('quizServer').value = quiz.serverId;
            }
            
            renderAddedQuestions();
            document.getElementById('questionsContainer').innerHTML = '';
            addQuestionField();
            
            document.getElementById('quizBuilderModal').classList.add('active');
        }

        function closeQuizBuilder() {
            document.getElementById('quizBuilderModal').classList.remove('active');
            editingQuizId = null;
            tempQuestions = [];
        }

        function addQuestionField() {
            const container = document.getElementById('questionsContainer');
            const qIndex = container.children.length;
            const div = document.createElement('div');
            div.className = 'question-builder';
            div.innerHTML = `
                <div class="q-header">
                    <h4>❓ Question ${qIndex + 1}</h4>
                    <button class="action-btn glass" onclick="this.closest('.question-builder').remove()"><i class="fas fa-times"></i></button>
                </div>
                <div class="input-group">
                    <input type="text" class="q-text" placeholder="Enter question text..." value="">
                </div>
                <div class="options-grid">
                    <div class="opt-input"><label>A.</label><input type="text" class="opt-input-a" placeholder="Option A" value=""></div>
                    <div class="opt-input"><label>B.</label><input type="text" class="opt-input-b" placeholder="Option B" value=""></div>
                    <div class="opt-input"><label>C.</label><input type="text" class="opt-input-c" placeholder="Option C" value=""></div>
                    <div class="opt-input"><label>D.</label><input type="text" class="opt-input-d" placeholder="Option D" value=""></div>
                </div>
                <div class="correct-option">
                    <label>✅ Correct Answer:</label>
                    <select class="q-correct">
                        <option value="0">A</option>
                        <option value="1">B</option>
                        <option value="2">C</option>
                        <option value="3">D</option>
                    </select>
                    <button class="action-btn success" onclick="addQuestionToList(this)"><i class="fas fa-plus"></i> Add</button>
                </div>
            `;
            container.appendChild(div);
        }

        function addQuestionToList(btn) {
            const builder = btn.closest('.question-builder');
            const text = builder.querySelector('.q-text').value.trim();
            const optA = builder.querySelector('.opt-input-a').value.trim();
            const optB = builder.querySelector('.opt-input-b').value.trim();
            const optC = builder.querySelector('.opt-input-c').value.trim();
            const optD = builder.querySelector('.opt-input-d').value.trim();
            const correct = parseInt(builder.querySelector('.q-correct').value);
            
            if (!text) { showToast('Please enter question text', 'error'); return; }
            if (!optA || !optB || !optC || !optD) { showToast('Please fill all options', 'error'); return; }
            
            tempQuestions.push({
                id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                text: text,
                options: [optA, optB, optC, optD],
                correct: correct,
                explanation: ''
            });
            
            builder.querySelector('.q-text').value = '';
            builder.querySelector('.opt-input-a').value = '';
            builder.querySelector('.opt-input-b').value = '';
            builder.querySelector('.opt-input-c').value = '';
            builder.querySelector('.opt-input-d').value = '';
            builder.querySelector('.q-correct').value = '0';
            
            renderAddedQuestions();
            showToast('✅ Question added!');
        }

        function renderAddedQuestions() {
            const container = document.getElementById('addedQuestionsList');
            if (!container) return;
            if (tempQuestions.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary);padding:12px;text-align:center;">No questions added yet.</p>';
                return;
            }
            container.innerHTML = tempQuestions.map((q, idx) => `
                <div class="question-list-item">
                    <div class="q-info">
                        <strong>Q${idx + 1}: ${q.text}</strong>
                        <small>Options: ${q.options.join(' · ')} | ✅ Correct: ${q.options[q.correct]}</small>
                    </div>
                    <div class="q-actions">
                        <button class="action-btn danger" onclick="removeQuestion(${idx})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function removeQuestion(index) {
            tempQuestions.splice(index, 1);
            renderAddedQuestions();
            showToast('Question removed');
        }

        function addFromBank() {
            const bank = DB.getQuestionBank();
            if (bank.length === 0) {
                showToast('Question bank is empty!', 'error');
                return;
            }
            bank.forEach(q => {
                tempQuestions.push({
                    id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    text: q.text,
                    options: q.options,
                    correct: q.correct,
                    explanation: q.explanation || ''
                });
            });
            renderAddedQuestions();
            showToast(`✅ Added ${bank.length} questions from bank`);
        }

        function saveQuizBuilder() {
            const title = document.getElementById('quizTitle').value.trim();
            const description = document.getElementById('quizDescription').value.trim();
            const duration = document.getElementById('quizDuration').value;
            const category = document.getElementById('quizCategory').value;
            const difficulty = document.getElementById('quizDifficulty').value;
            const serverId = document.getElementById('quizServer').value;
            
            if (!title) { showToast('Please enter quiz title', 'error'); return; }
            if (!duration || duration < 1) { showToast('Please enter valid duration', 'error'); return; }
            if (!serverId) { showToast('Please select a server', 'error'); return; }
            if (tempQuestions.length === 0) { showToast('Please add at least one question', 'error'); return; }
            
            const quizData = {
                title,
                description,
                duration: parseInt(duration),
                category,
                difficulty,
                serverId: serverId,  // ✅ YAHAN SAVE HO RAHA HAI
                questions: tempQuestions,
                published: true
            };
            
            if (editingQuizId) {
                DB.updateQuiz(editingQuizId, quizData);
                showToast('✅ Quiz updated successfully!');
            } else {
                DB.createQuiz(quizData);
                showToast('✅ Quiz published successfully!');
            }
            
            closeQuizBuilder();
            loadQuizzes();
        }

        // ============================================================
        //  QUIZ ACTIONS
        // ============================================================
        function editQuiz(quizId) {
            const quiz = DB.getQuizById(quizId);
            if (!quiz) { showToast('Quiz not found!', 'error'); return; }
            openQuizBuilder(quiz);
        }

        function duplicateQuiz(quizId) {
            const quiz = DB.getQuizById(quizId);
            if (!quiz) { showToast('Quiz not found!', 'error'); return; }
            
            const newQuiz = DB.createQuiz({
                title: quiz.title + ' (Copy)',
                description: quiz.description || '',
                duration: quiz.duration || 10,
                category: quiz.category || 'General',
                difficulty: quiz.difficulty || 'Medium',
                serverId: quiz.serverId || null,
                questions: JSON.parse(JSON.stringify(quiz.questions || [])),
                published: false
            });
            
            if (newQuiz) {
                showToast('✅ Quiz duplicated successfully!');
                loadQuizzes();
            }
        }

        function togglePublish(quizId) {
            const quiz = DB.getQuizById(quizId);
            if (!quiz) { showToast('Quiz not found!', 'error'); return; }
            
            const newStatus = !quiz.published;
            DB.updateQuiz(quizId, { published: newStatus });
            showToast(`✅ Quiz ${newStatus ? 'published' : 'hidden'} successfully!`);
            loadQuizzes();
        }

        function deleteQuiz(quizId) {
            if (!confirm('⚠️ Are you sure you want to delete this quiz permanently?')) return;
            const quiz = DB.getQuizById(quizId);
            if (!quiz) { showToast('Quiz not found!', 'error'); return; }
            
            DB.deleteQuiz(quizId);
            showToast('🗑️ Quiz deleted successfully!');
            loadQuizzes();
        }

        function manageQuestions(quizId) {
            const quiz = DB.getQuizById(quizId);
            if (!quiz) { showToast('Quiz not found!', 'error'); return; }
            showToast(`📋 "${quiz.title}" has ${quiz.questions?.length || 0} questions.`, 'info');
        }

        // ============================================================
        //  QUESTION BANK
        // ============================================================
        let bankVisible = false;

        function toggleQuestionBank() {
            const panel = document.getElementById('questionBankPanel');
            bankVisible = !bankVisible;
            panel.style.display = bankVisible ? 'block' : 'none';
            if (bankVisible) loadQuestionBank();
        }

        function loadQuestionBank() {
            const container = document.getElementById('questionBankList');
            if (!container) return;
            const bank = DB.getQuestionBank();
            if (bank.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:20px;">Question bank is empty</p>';
                return;
            }
            container.innerHTML = bank.map(q => `
                <div class="bank-item">
                    <div class="q-text">${q.text}</div>
                    <div class="q-options">${q.options.join(' · ')}</div>
                    <div class="q-actions">
                        <button class="action-btn success" onclick="addBankQuestionToQuiz('${q.id}')"><i class="fas fa-plus"></i></button>
                        <button class="action-btn danger" onclick="removeFromBank('${q.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function addBankQuestionToQuiz(id) {
            const bank = DB.getQuestionBank();
            const question = bank.find(q => q.id === id);
            if (!question) return;
            tempQuestions.push({
                id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                text: question.text,
                options: question.options,
                correct: question.correct,
                explanation: question.explanation || ''
            });
            renderAddedQuestions();
            showToast('✅ Question added to quiz');
        }

        function addQuestionToBank() {
            const text = prompt('Enter question text:');
            if (!text) return;
            const options = [];
            for (let i = 0; i < 4; i++) {
                const opt = prompt(`Option ${String.fromCharCode(65 + i)}:`);
                if (opt === null) return;
                options.push(opt);
            }
            const correct = parseInt(prompt('Correct option index (0-3):'));
            if (isNaN(correct) || correct < 0 || correct > 3) {
                showToast('Invalid correct option', 'error');
                return;
            }
            DB.addToQuestionBank({ text, options, correct });
            loadQuestionBank();
            showToast('✅ Question added to bank');
        }

        function removeFromBank(id) {
            if (!confirm('Remove this question from bank?')) return;
            DB.removeFromQuestionBank(id);
            loadQuestionBank();
            showToast('Question removed from bank');
        }

        // ============================================================
        //  IMPORT / EXPORT
        // ============================================================
        function importQuizJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        let importedCount = 0;
                        
                        if (Array.isArray(data)) {
                            data.forEach(item => {
                                if (item.title && item.questions) {
                                    DB.createQuiz({
                                        title: item.title,
                                        description: item.description || '',
                                        duration: item.duration || 10,
                                        category: item.category || 'General',
                                        difficulty: item.difficulty || 'Medium',
                                        serverId: item.serverId || null,
                                        questions: item.questions.map(q => ({
                                            id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                                            text: q.text || 'Question',
                                            options: q.options || ['A', 'B', 'C', 'D'],
                                            correct: q.correct || 0,
                                            explanation: q.explanation || ''
                                        })),
                                        published: item.published !== undefined ? item.published : true
                                    });
                                    importedCount++;
                                }
                            });
                        } else if (data.title && data.questions) {
                            DB.createQuiz({
                                title: data.title,
                                description: data.description || '',
                                duration: data.duration || 10,
                                category: data.category || 'General',
                                difficulty: data.difficulty || 'Medium',
                                serverId: data.serverId || null,
                                questions: data.questions.map(q => ({
                                    id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                                    text: q.text || 'Question',
                                    options: q.options || ['A', 'B', 'C', 'D'],
                                    correct: q.correct || 0,
                                    explanation: q.explanation || ''
                                })),
                                published: data.published !== undefined ? data.published : true
                            });
                            importedCount++;
                        } else if (data.text && data.options) {
                            DB.addToQuestionBank({ text: data.text, options: data.options, correct: data.correct || 0 });
                            showToast('✅ Question added to bank!');
                            loadQuizzes();
                            return;
                        } else {
                            showToast('❌ Invalid format!', 'error');
                            return;
                        }
                        
                        if (importedCount > 0) {
                            showToast(`✅ ${importedCount} quiz(zes) imported successfully!`);
                            loadQuizzes();
                        } else {
                            showToast('❌ No valid quizzes found.', 'error');
                        }
                    } catch(err) {
                        showToast('❌ Error parsing JSON: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportQuizJSON() {
            const quizzes = DB.getQuizzes();
            const data = JSON.stringify(quizzes, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'quizzes_export.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 Quizzes exported');
        }

        // ============================================================
        //  PARTICLES
        // ============================================================
        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            const particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 118, ${p.opacity})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // ============================================================
        //  PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('quiznexus_admin_session')) {
                redirectTo('admin-login.html');
                return;
            }
            const settings = DB.getSettings();
            if (settings.theme) applyTheme(settings.theme);
            initParticles();
            loadQuizzes();
            loadServerDropdown();
        });

        // ============================================================
        //  GLOBAL EXPORTS
        // ============================================================
        window.loadQuizzes = loadQuizzes;
        window.filterQuizzes = filterQuizzes;
        window.openQuizBuilder = openQuizBuilder;
        window.closeQuizBuilder = closeQuizBuilder;
        window.addQuestionField = addQuestionField;
        window.addQuestionToList = addQuestionToList;
        window.removeQuestion = removeQuestion;
        window.addFromBank = addFromBank;
        window.saveQuizBuilder = saveQuizBuilder;
        window.editQuiz = editQuiz;
        window.duplicateQuiz = duplicateQuiz;
        window.togglePublish = togglePublish;
        window.deleteQuiz = deleteQuiz;
        window.manageQuestions = manageQuestions;
        window.toggleQuestionBank = toggleQuestionBank;
        window.addQuestionToBank = addQuestionToBank;
        window.addBankQuestionToQuiz = addBankQuestionToQuiz;
        window.removeFromBank = removeFromBank;
        window.importQuizJSON = importQuizJSON;
        window.exportQuizJSON = exportQuizJSON;
        window.logout = logout;
        window.toggleTheme = toggleTheme;
        window.loadServerDropdown = loadServerDropdown;
    </script>
</body>
</html>
