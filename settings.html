<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Theme Meta Tag -->
<meta name="theme-color" content="#0b1a0e">
    <!-- Prevent page zoom and scroll issues -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Settings · QuizNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ===== PWA ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00e676">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/logo.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <style>
        /* ===== FIXED SETTINGS STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at 20% 20%, #132b17, #051007);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e2f0e5;
            overflow-x: hidden;
        }
        
        [data-theme="light"] body {
            background: radial-gradient(ellipse at 20% 20%, #e8f5e9, #c8e6c9);
        }
        
        /* ===== APP LAYOUT - FIXED ===== */
        .app-layout {
            display: flex;
            min-height: 100vh;
            padding: 16px;
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* ===== SIDEBAR - STICKY ===== */
        .sidebar {
            width: 240px;
            padding: 24px 16px;
            position: sticky;
            top: 16px;
            height: calc(100vh - 32px);
            overflow-y: auto;
            flex-shrink: 0;
            background: rgba(15, 32, 19, 0.65);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(0, 255, 100, 0.15);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
            border-radius: 28px;
            transition: all 0.3s;
        }
        
        .sidebar:hover {
            border-color: rgba(0, 230, 118, 0.3);
        }
        
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 24px;
            border-bottom: 1px solid rgba(0, 255, 100, 0.15);
            margin-bottom: 20px;
        }
        
        .sidebar-brand .brand-text {
            font-weight: 700;
            font-size: 1.4rem;
            color: #e2f0e5;
        }
        
        .sidebar-brand .brand-text .accent {
            color: #00e676;
        }
        
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 16px;
            color: #8fb89a;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
            cursor: pointer;
        }
        
        .nav-item:hover {
            background: rgba(0, 230, 118, 0.08);
            color: #e2f0e5;
        }
        
        .nav-item.active {
            background: rgba(0, 230, 118, 0.12);
            color: #00e676;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.05);
        }
        
        .nav-item i {
            width: 20px;
            text-align: center;
        }
        
        /* ===== MAIN CONTENT - SCROLLABLE ===== */
        .main-content {
            flex: 1;
            padding: 0 8px 20px;
            min-height: 100vh;
            overflow-y: auto;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            background: rgba(11, 26, 14, 0.8);
            backdrop-filter: blur(12px);
            z-index: 10;
            border-radius: 0 0 20px 20px;
            margin-bottom: 8px;
        }
        
        [data-theme="light"] .dashboard-header {
            background: rgba(240, 247, 242, 0.8);
        }
        
        .dashboard-header h1 {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .theme-toggle {
            background: transparent;
            border: 1px solid rgba(0, 255, 100, 0.15);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #e2f0e5;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .theme-toggle:hover {
            background: rgba(0, 230, 118, 0.1);
            border-color: #00e676;
        }
        
        /* ===== SETTINGS CONTAINER - FIXED SCROLL ===== */
        .settings-container {
            padding: 28px;
            max-width: 700px;
            margin-bottom: 40px;
            animation: slideUp 0.5s ease;
        }
        
        .settings-section {
            margin-bottom: 32px;
        }
        
        .settings-section h3 {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }
        
        .settings-section h3 i {
            font-size: 1.3rem;
        }
        
        .setting-group {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            transition: all 0.3s;
        }
        
        [data-theme="light"] .setting-group {
            background: rgba(0, 0, 0, 0.04);
        }
        
        .setting-group:hover {
            background: rgba(0, 230, 118, 0.04);
        }
        
        .setting-group label {
            min-width: 120px;
            color: #8fb89a;
            font-weight: 500;
        }
        
        .setting-group select {
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 255, 100, 0.15);
            color: #e2f0e5;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
        }
        
        .setting-group select:focus {
            border-color: #00e676;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.1);
        }
        
        .setting-group input[type="checkbox"] {
            accent-color: #00e676;
            width: 20px;
            height: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .setting-group input[type="checkbox"]:hover {
            transform: scale(1.1);
        }
        
        .theme-options {
            display: flex;
            gap: 10px;
        }
        
        .theme-option {
            padding: 10px 20px;
            border-radius: 60px;
            border: 1.5px solid rgba(0, 255, 100, 0.15);
            background: transparent;
            color: #8fb89a;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .theme-option:hover {
            border-color: #00e676;
            color: #e2f0e5;
            background: rgba(0, 230, 118, 0.05);
            transform: translateY(-2px);
        }
        
        .theme-option.active {
            border-color: #00e676;
            color: #00e676;
            background: rgba(0, 230, 118, 0.1);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.05);
        }
        
        .color-options input[type="color"] {
            width: 44px;
            height: 44px;
            border: 2px solid rgba(0, 255, 100, 0.15);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 3px;
            transition: all 0.3s;
        }
        
        .color-options input[type="color"]:hover {
            transform: scale(1.05);
            border-color: #00e676;
        }
        
        .color-options input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        
        .color-options input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }
        
        .danger-zone {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 68, 68, 0.2);
        }
        
        .danger-zone h3 {
            color: #ff6b6b;
        }
        
        .btn-danger {
            border-color: #ff4444;
            color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.05);
        }
        
        .btn-danger:hover {
            background: #ff4444;
            color: white;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.3);
        }
        
        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
        }
        
        .toast {
            background: rgba(20, 40, 25, 0.92);
            backdrop-filter: blur(14px);
            border-left: 4px solid #00e676;
            padding: 14px 20px;
            border-radius: 16px;
            color: #e2f0e5;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            font-weight: 500;
            animation: toastSlideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .toast.error {
            border-left-color: #ff4444;
        }
        
        @keyframes toastSlideIn {
            0% { opacity: 0; transform: translateX(50px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        
        .toast-exit {
            animation: toastSlideOut 0.3s ease forwards;
        }
        
        @keyframes toastSlideOut {
            0% { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(50px) scale(0.95); }
        }
        
        /* ===== PARTICLES ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                top: 0;
                padding: 16px;
                max-height: none;
            }
            
            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .nav-item {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .nav-item.active::before {
                display: none;
            }
            
            .main-content {
                padding: 0 4px 20px;
                overflow-y: visible;
            }
            
            .dashboard-header {
                position: relative;
                top: 0;
                padding: 12px 0 16px;
                background: transparent;
                backdrop-filter: none;
            }
            
            .settings-container {
                padding: 20px;
            }
            
            .setting-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .setting-group label {
                min-width: auto;
            }
            
            .theme-options {
                width: 100%;
            }
            
            .theme-option {
                flex: 1;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .settings-container {
                padding: 16px;
            }
            
            .setting-group {
                padding: 10px 12px;
            }
            
            .setting-group select {
                width: 100%;
            }
            
            .dashboard-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <body data-theme="dark"></body>
    <canvas id="particles-canvas"></canvas>
    
    <div class="app-layout">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar glass">
            <div class="sidebar-brand">
                <img src="assets/images/logo.png" alt="QuizNexus" style="width:50px; height:50px; object-fit:contain; border-radius:12px;">
                <span class="brand-text">Quiz<span class="accent">Nexus</span></span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="quiz.html" class="nav-item"><i class="fas fa-play-circle"></i> Available Quiz</a>
                <a href="result.html" class="nav-item"><i class="fas fa-chart-bar"></i> My Results</a>
                <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
                <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i> Profile</a>
                <a href="settings.html" class="nav-item active"><i class="fas fa-cog"></i> Settings</a>
                <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">
            <header class="dashboard-header">
                <h1>⚙️ Settings</h1>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="settings-container glass">
                <!-- ===== APPEARANCE ===== -->
                <div class="settings-section">
                    <h3><i class="fas fa-palette" style="color: var(--accent);"></i> Appearance</h3>
                    
                    <div class="setting-group">
                        <label><i class="fas fa-moon"></i> Theme</label>
                        <div class="theme-options">
                            <button class="theme-option active" onclick="setTheme('dark')">
                                <i class="fas fa-moon"></i> Dark
                            </button>
                            <button class="theme-option" onclick="setTheme('light')">
                                <i class="fas fa-sun"></i> Light
                            </button>
                        </div>
                    </div>
                    
                    <div class="setting-group">
                        <label><i class="fas fa-paint-brush"></i> Accent Color</label>
                        <div class="color-options">
                            <input type="color" id="accentColor" value="#00e676" onchange="setAccentColor(this.value)">
                        </div>
                    </div>
                </div>

                <!-- ===== PREFERENCES ===== -->
                <div class="settings-section">
                    <h3><i class="fas fa-sliders-h" style="color: #4fc3f7;"></i> Preferences</h3>
                    
                    <div class="setting-group">
                        <label><input type="checkbox" id="animationsToggle" checked> Enable Animations</label>
                    </div>
                    
                    <div class="setting-group">
                        <label><input type="checkbox" id="notificationsToggle" checked> Enable Notifications</label>
                    </div>
                    
                    <div class="setting-group">
                        <label><input type="checkbox" id="soundToggle" checked> Enable Sound</label>
                    </div>
                    
                    <div class="setting-group">
                        <label><i class="fas fa-font"></i> Font Size</label>
                        <select id="fontSize" onchange="setFontSize(this.value)">
                            <option value="small">Small</option>
                            <option value="medium" selected>Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label><i class="fas fa-globe"></i> Language</label>
                        <select id="language" onchange="setLanguage(this.value)">
                            <option value="en">🇬🇧 English</option>
                            <option value="ur">🇵🇰 Urdu</option>
                            <option value="es">🇪🇸 Spanish</option>
                            <option value="fr">🇫🇷 French</option>
                        </select>
                    </div>
                </div>

                <!-- ===== DANGER ZONE ===== -->
                <div class="settings-section danger-zone">
                    <h3><i class="fas fa-exclamation-triangle"></i> Danger Zone</h3>
                    
                    <div class="setting-group">
                        <button class="btn-outline" onclick="resetSettings()">
                            <i class="fas fa-undo"></i> Reset Settings
                        </button>
                        <button class="btn-outline btn-danger" onclick="clearAllData()">
                            <i class="fas fa-trash"></i> Clear LocalStorage
                        </button>
                        <button class="btn-primary" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  DATABASE
        // ============================================================
        const DB = {
            SETTINGS: 'quiznexus_settings',
            CURRENT_USER: 'quiznexus_current_user',
            getSettings() {
                return JSON.parse(localStorage.getItem(this.SETTINGS)) || {
                    theme: 'dark',
                    accentColor: '#00e676',
                    animations: true,
                    notifications: true,
                    sound: true,
                    fontSize: 'medium',
                    language: 'en'
                };
            },
            saveSettings(settings) {
                localStorage.setItem(this.SETTINGS, JSON.stringify(settings));
            },
            getCurrentUser() {
                const data = localStorage.getItem(this.CURRENT_USER);
                return data ? JSON.parse(data) : null;
            },
            clearCurrentUser() {
                localStorage.removeItem(this.CURRENT_USER);
            },
            clearAll() {
                localStorage.clear();
            }
        };

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) {
                const newContainer = document.createElement('div');
                newContainer.id = 'toastContainer';
                newContainer.className = 'toast-container';
                document.body.appendChild(newContainer);
                return showToast(message, type);
            }
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 
                         type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `
                <i class="fas ${icon}"></i>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function redirectTo(page) {
            window.location.href = page;
        }

        function logout() {
            DB.clearCurrentUser();
            showToast('Logged out successfully');
            setTimeout(() => redirectTo('login.html'), 400);
        }

        // ============================================================
        //  THEME FUNCTIONS
        // ============================================================
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            
            document.querySelectorAll('.theme-toggle i').forEach(icon => {
                icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            });
            
            if (theme === 'light') {
                document.body.style.background = 'radial-gradient(ellipse at 20% 20%, #e8f5e9, #c8e6c9)';
            } else {
                document.body.style.background = 'radial-gradient(circle at 20% 20%, #132b17, #051007)';
            }
        }

        function setTheme(theme) {
            const settings = DB.getSettings();
            settings.theme = theme;
            DB.saveSettings(settings);
            
            applyTheme(theme);
            
            document.querySelectorAll('.theme-option').forEach(btn => {
                const btnTheme = btn.textContent.toLowerCase().includes('dark') ? 'dark' : 'light';
                btn.classList.toggle('active', btnTheme === theme);
            });
            
            showToast(`Theme switched to ${theme} mode`);
        }

        function toggleTheme() {
            const settings = DB.getSettings();
            const newTheme = settings.theme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }

        function setAccentColor(color) {
            const settings = DB.getSettings();
            settings.accentColor = color;
            DB.saveSettings(settings);
            
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--accent-hover', color);
            
            showToast('Accent color updated');
        }

        function setFontSize(size) {
            const settings = DB.getSettings();
            settings.fontSize = size;
            DB.saveSettings(settings);
            
            const sizes = {
                small: '14px',
                medium: '16px',
                large: '18px'
            };
            document.documentElement.style.fontSize = sizes[size] || '16px';
            showToast(`Font size set to ${size}`);
        }

        function setLanguage(lang) {
            const settings = DB.getSettings();
            settings.language = lang;
            DB.saveSettings(settings);
            
            const names = {
                en: 'English',
                ur: 'Urdu',
                es: 'Spanish',
                fr: 'French'
            };
            showToast(`Language set to ${names[lang] || lang.toUpperCase()}`);
        }

        function saveSetting(key, value) {
            const settings = DB.getSettings();
            settings[key] = value;
            DB.saveSettings(settings);
        }

        function resetSettings() {
            if (confirm('Reset all settings to default?')) {
                const defaultSettings = {
                    theme: 'dark',
                    accentColor: '#00e676',
                    animations: true,
                    notifications: true,
                    sound: true,
                    fontSize: 'medium',
                    language: 'en'
                };
                DB.saveSettings(defaultSettings);
                loadSettings();
                showToast('Settings reset to default');
            }
        }

        function clearAllData() {
            if (confirm('⚠️ Delete ALL data? This cannot be undone!')) {
                if (confirm('Final confirmation: This action is permanent!')) {
                    DB.clearAll();
                    showToast('All data cleared');
                    setTimeout(() => redirectTo('login.html'), 500);
                }
            }
        }

        // ============================================================
        //  LOAD SETTINGS
        // ============================================================
        function loadSettings() {
            const settings = DB.getSettings();
            
            // Theme
            document.querySelectorAll('.theme-option').forEach(btn => {
                const theme = btn.textContent.toLowerCase().includes('dark') ? 'dark' : 'light';
                btn.classList.toggle('active', settings.theme === theme);
            });
            
            // Toggles
            document.getElementById('animationsToggle').checked = settings.animations !== false;
            document.getElementById('notificationsToggle').checked = settings.notifications !== false;
            document.getElementById('soundToggle').checked = settings.sound !== false;
            
            // Font size
            document.getElementById('fontSize').value = settings.fontSize || 'medium';
            
            // Language
            document.getElementById('language').value = settings.language || 'en';
            
            // Accent color
            document.getElementById('accentColor').value = settings.accentColor || '#00e676';
            
            // Apply settings
            applyTheme(settings.theme || 'dark');
            document.documentElement.style.setProperty('--accent', settings.accentColor || '#00e676');
            
            const sizes = {
                small: '14px',
                medium: '16px',
                large: '18px'
            };
            document.documentElement.style.fontSize = sizes[settings.fontSize || 'medium'] || '16px';
        }

        // ============================================================
        //  PARTICLES
        // ============================================================
        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            let w, h;
            
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            
            const particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.4 + 0.2
                });
            }
            
            function draw() {
                ctx.clearRect(0, 0, w, h);
                
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 230, 118, ${p.opacity})`;
                    ctx.fill();
                });
                
                requestAnimationFrame(draw);
            }
            draw();
        }

        // ============================================================
        //  PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = DB.getCurrentUser();
            if (!currentUser) {
                redirectTo('login.html');
                return;
            }
            
            initParticles();
            loadSettings();
            
            // Event Listeners
            document.getElementById('animationsToggle').addEventListener('change', function() {
                saveSetting('animations', this.checked);
                showToast(this.checked ? 'Animations enabled' : 'Animations disabled');
            });
            
            document.getElementById('notificationsToggle').addEventListener('change', function() {
                saveSetting('notifications', this.checked);
                showToast(this.checked ? 'Notifications enabled' : 'Notifications disabled');
            });
            
            document.getElementById('soundToggle').addEventListener('change', function() {
                saveSetting('sound', this.checked);
                showToast(this.checked ? 'Sound enabled' : 'Sound disabled');
            });
        });

        // ============================================================
        //  GLOBAL EXPORTS
        // ============================================================
        window.setTheme = setTheme;
        window.toggleTheme = toggleTheme;
        window.setAccentColor = setAccentColor;
        window.setFontSize = setFontSize;
        window.setLanguage = setLanguage;
        window.saveSetting = saveSetting;
        window.resetSettings = resetSettings;
        window.clearAllData = clearAllData;
        window.logout = logout;
        window.showToast = showToast;
    </script>
</body>
</html>
